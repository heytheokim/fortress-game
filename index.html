<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>포트리스 클론 - 4단계</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: #10131c;
    color: #eee;
    font-family: "Courier New", monospace;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    gap: 10px;
    user-select: none;
  }

  h1 { font-size: 16px; letter-spacing: 3px; color: #ffd700; }

  #frame {
    border: 4px solid #2a3244;
    border-radius: 6px;
    background: #000;
    image-rendering: pixelated;
    box-shadow: 0 0 40px rgba(30, 90, 160, 0.25);
  }
  canvas { display: block; image-rendering: pixelated; }

  #help { font-size: 12px; color: #6d7a8f; line-height: 1.8; text-align: center; }
  #help b { color: #ffd700; }
</style>
</head>
<body>

  <h1>◆ FORTRESS ◆</h1>

  <div id="frame">
    <canvas id="game" width="800" height="580"></canvas>
  </div>

  <div id="help">
    <b>← →</b> 이동(연료 소모) &nbsp; <b>↑ ↓</b> 각도 &nbsp; <b>스페이스 꾹</b> 파워→발사 &nbsp;
    <b>1 2</b> 발사 종류 &nbsp; <b>S</b> 오브(필살기) &nbsp; <b>H</b> 힌트 &nbsp; <b>X</b> 음소거 &nbsp; <b>R</b> 재대결 &nbsp; <b>M</b> 처음
  </div>

<script>
/* =========================================================
   포트리스 클론 - 4단계: 새 단장
   탱크 3종 / 맵 3종 선택 + 이동 + 하단 HUD + 이펙트 강화
   ========================================================= */

// ---------- 캔버스 ----------
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
const W = canvas.width;          // 800
const H = canvas.height;         // 580 (아래 80px은 HUD 패널)
const GROUND_H = 500;            // 게임이 벌어지는 영역의 세로 크기
const HUD_Y = GROUND_H;          // HUD 패널이 시작되는 y

// ---------- 게임 설정값 ----------
const CONFIG = {
  gravity: 0.11,
  powerMax: 100,
  powerSpeed: 1.1,
  powerScale: 0.10,     // 최대 파워로 45도 발사 시 화면 끝에 겨우 닿는 값
  angleSpeed: 1,
  maxHp: 100,
  hitRadius: 16,        // 포탄이 대포에 직격했다고 보는 거리

  fuelMax: 70,          // 한 턴에 움직일 수 있는 거리(픽셀)
  moveSpeed: 1.2,       // 이동 속도 (프레임당 픽셀)

  // 오브(필살기) 게이지: 100이 되면 쓸 수 있습니다.
  // 20판씩 돌려 맞춘 값입니다. 더 빠르게(14/22/10) 두면 판당 오브가 2.3회씩
  // 나와서 판이 1.6분으로 짧아지고 오브가 특별하지 않게 됩니다.
  gaugeMax: 100,
  gaugePerTurn: 5,      // 턴이 돌아올 때마다 자동으로 차는 양
  gaugePerHit: 11,      // 적을 맞히면 추가로 차는 양 (잘 맞힐수록 빨리 모임)
  gaugeWhenHurt: 4,     // 내가 맞아도 조금 찹니다 (지고 있어도 역전 기회)

  selfDamage: 0.5,      // 자기 포탄에 자기가 맞으면 데미지 절반 (실수 한 번에 판이 뒤집히지 않게)
  fallDamage: 0.15,     // 대포가 떨어질 때 1px당 데미지
  fallDamageMax: 20,

  turnTime: 20,         // 내 차례 제한 시간(초). 다 되면 자동으로 턴이 넘어갑니다

  aiThinkTime: 55,
  aiFirstError: 320,    // 40판씩 돌려 맞춘 값 — 줄이면 AI가 급격히 강해짐
  aiErrorDecay: 0.65,
  aiMinError: 32,

  windMax: 5,
  windUnit: 0.004,      // 최대 바람일 때 긴 발이 100px쯤 밀리는 값
};

// ---------- 소리 ----------
// 음원 파일(mp3) 없이 코드로 직접 소리를 만듭니다 (Web Audio API).
// 원리는 간단합니다: "소리를 내는 장치(oscillator)"를 만들고 → "볼륨 손잡이(gain)"에
// 연결한 뒤 → 볼륨을 빠르게 0으로 줄이면 "펑" 하는 효과음이 됩니다.
// 이 방식이라 파일이 index.html 하나로 유지되고, 8비트 레트로 느낌과도 잘 맞습니다.

let audioCtx = null;
let masterGain = null;    // 전체 볼륨 손잡이
let masterFilter = null;  // 전체에 씌우는 "부드럽게 만드는" 필터
let muted = localStorage.getItem('fortress_muted') === '1';

// 브라우저는 사용자가 키를 누르거나 클릭하기 전엔 소리를 못 내게 막습니다(자동재생 차단).
// 그래서 첫 입력이 들어온 순간에 이 함수로 오디오를 깨웁니다.
function initAudio() {
  if (audioCtx) { if (audioCtx.state === 'suspended') audioCtx.resume(); return; }
  const AC = window.AudioContext || window.webkitAudioContext;
  if (!AC) return;                       // 아주 오래된 브라우저면 소리 없이 그냥 진행
  audioCtx = new AC();

  // 모든 소리는 반드시 이 두 단계를 거쳐 나갑니다.
  // 1) masterFilter: 3.2kHz 위쪽(귀를 찌르는 고음)을 깎아냅니다 → 소리가 부드러워짐
  // 2) masterGain: 전체 음량을 낮게 눌러둡니다 → 여러 소리가 겹쳐도 시끄럽지 않음
  masterFilter = audioCtx.createBiquadFilter();
  masterFilter.type = 'lowpass';
  masterFilter.frequency.value = 3200;
  masterFilter.Q.value = 0.6;
  masterGain = audioCtx.createGain();
  masterGain.gain.value = 0.5;
  masterFilter.connect(masterGain).connect(audioCtx.destination);
}

// 모든 효과음의 기본 재료.
// 이전 버전이 거슬렸던 가장 큰 이유는 (1) 사각파의 날카로운 고음과
// (2) 소리가 0에서 최대 볼륨으로 "탁" 튀는 것이었습니다. 사람 귀는 이 급격한
// 시작(어택)을 "딱!" 하는 잡음으로 듣습니다. 그래서 아주 짧게(2~15ms) 볼륨을
// 밀어올렸다가 줄이는 방식으로 바꿨습니다.
function tone(o) {
  if (muted || !audioCtx) return;
  const {
    freq, dur, type = 'triangle', vol = 0.2,
    slide = null, attack = 0.008, detune = 0,
  } = o;
  const t = audioCtx.currentTime;
  const osc = audioCtx.createOscillator();
  const gain = audioCtx.createGain();
  osc.type = type;
  osc.detune.value = detune;
  osc.frequency.setValueAtTime(freq, t);
  if (slide !== null) osc.frequency.exponentialRampToValueAtTime(Math.max(1, slide), t + dur);
  gain.gain.setValueAtTime(0.0001, t);
  gain.gain.linearRampToValueAtTime(vol, t + attack);          // 부드럽게 커졌다가
  gain.gain.exponentialRampToValueAtTime(0.0001, t + dur);     // 서서히 사라짐
  osc.connect(gain).connect(masterFilter);
  osc.start(t);
  osc.stop(t + dur + 0.02);
}

// "치익" 하는 잡음. 폭발음의 재료입니다 (오실레이터만으론 폭발 느낌이 안 납니다).
// curve 값이 클수록 소리가 빨리 사그라듭니다.
function noise(o) {
  if (muted || !audioCtx) return;
  const { dur, vol = 0.3, filterHz = 900, curve = 1.6, sweepTo = null } = o;
  const t = audioCtx.currentTime;
  const len = Math.floor(audioCtx.sampleRate * dur);
  const buf = audioCtx.createBuffer(1, len, audioCtx.sampleRate);
  const data = buf.getChannelData(0);
  for (let i = 0; i < len; i++) {
    data[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / len, curve);
  }
  const src = audioCtx.createBufferSource();
  src.buffer = buf;
  const lp = audioCtx.createBiquadFilter();
  lp.type = 'lowpass';
  lp.frequency.setValueAtTime(filterHz, t);
  // 필터를 서서히 닫으면 "쿠우웅" 하고 멀어지는 느낌이 납니다
  if (sweepTo !== null) lp.frequency.exponentialRampToValueAtTime(Math.max(60, sweepTo), t + dur);
  const gain = audioCtx.createGain();
  gain.gain.setValueAtTime(0.0001, t);
  gain.gain.linearRampToValueAtTime(vol, t + 0.006);
  gain.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  src.connect(lp).connect(gain).connect(masterFilter);
  src.start(t);
}

// 잠깐 뒤에 소리내기 (여러 소리를 겹쳐 "한 방" 느낌을 만들 때 씁니다)
function later(ms, fn) { setTimeout(fn, ms); }

// --- 실제 게임에서 부르는 소리들 ---
// 탱크 3종은 발사음·폭발음의 "성격" 자체가 다릅니다.
//   레이븐(0) 균형형 : 딱 떨어지는 표준 포격음
//   매머드(1) 한방형 : 낮고 묵직한 대구경 — 폭발이 길게 울림
//   스톰(2)   광역형 : 높고 가벼운 발사 + 넓게 퍼지는 "쏴아" 폭발
const SFX = {
  fire(stats) {
    const kind = TANKS.indexOf(stats);
    if (kind === 1) {          // 매머드 — 낮고 묵직
      noise({ dur: 0.2, vol: 0.3, filterHz: 900, sweepTo: 200, curve: 1.2 });
      tone({ freq: 110, dur: 0.26, type: 'triangle', vol: 0.26, slide: 42, attack: 0.004 });
      later(18, () => tone({ freq: 62, dur: 0.22, type: 'sine', vol: 0.22, slide: 30 }));
    } else if (kind === 2) {   // 스톰 — 높고 가벼운 "슉"
      noise({ dur: 0.13, vol: 0.16, filterHz: 2200, sweepTo: 700, curve: 2.2 });
      tone({ freq: 330, dur: 0.16, type: 'triangle', vol: 0.17, slide: 130, attack: 0.004 });
    } else {                   // 레이븐 — 표준
      noise({ dur: 0.15, vol: 0.22, filterHz: 1500, sweepTo: 400, curve: 1.8 });
      tone({ freq: 190, dur: 0.2, type: 'triangle', vol: 0.21, slide: 70, attack: 0.004 });
    }
  },

  explode(stats) {
    const kind = TANKS.indexOf(stats);
    if (kind === 1) {          // 매머드 — 깊고 길게 울리는 폭발
      noise({ dur: 0.5, vol: 0.34, filterHz: 1100, sweepTo: 130, curve: 1.1 });
      tone({ freq: 78, dur: 0.5, type: 'sine', vol: 0.32, slide: 26, attack: 0.004 });
      later(45, () => tone({ freq: 52, dur: 0.42, type: 'sine', vol: 0.2, slide: 22 }));
    } else if (kind === 2) {   // 스톰 — 넓게 퍼지는 "쏴아"
      noise({ dur: 0.55, vol: 0.3, filterHz: 1800, sweepTo: 320, curve: 0.85 });
      tone({ freq: 128, dur: 0.3, type: 'sine', vol: 0.19, slide: 55, attack: 0.006 });
    } else {                   // 레이븐 — 표준
      noise({ dur: 0.34, vol: 0.3, filterHz: 1300, sweepTo: 200, curve: 1.5 });
      tone({ freq: 98, dur: 0.34, type: 'sine', vol: 0.26, slide: 34, attack: 0.004 });
    }
  },

  // 내가 맞았을 때 — 금속을 때리는 "탱" 소리 (삑삑거리지 않게)
  hit() {
    tone({ freq: 420, dur: 0.16, type: 'triangle', vol: 0.16, slide: 200, attack: 0.003 });
    tone({ freq: 631, dur: 0.13, type: 'sine', vol: 0.1, slide: 300, attack: 0.003 });
  },
  land()  {                                          // 대포가 쿵 떨어질 때
    noise({ dur: 0.22, vol: 0.22, filterHz: 500, sweepTo: 120, curve: 1.4 });
    tone({ freq: 64, dur: 0.2, type: 'sine', vol: 0.2, slide: 36, attack: 0.004 });
  },
  // --- 오브(필살기) 전용 소리 ---
  // 발사: 낮은 데서 높은 쪽으로 솟구치는 "차오르는" 느낌
  orb(stats) {
    tone({ freq: 160, dur: 0.4, type: 'triangle', vol: 0.2, slide: 620, attack: 0.02 });
    tone({ freq: 240, dur: 0.42, type: 'sine', vol: 0.14, slide: 930, attack: 0.03, detune: 8 });
    noise({ dur: 0.3, vol: 0.2, filterHz: 1600, sweepTo: 500, curve: 1.2 });
  },
  // 착탄: 묵직한 폭발 + 뒤따라 울리는 여운
  orbHit(stats) {
    noise({ dur: 0.75, vol: 0.36, filterHz: 1500, sweepTo: 110, curve: 0.9 });
    tone({ freq: 88, dur: 0.7, type: 'sine', vol: 0.34, slide: 24, attack: 0.004 });
    later(60,  () => tone({ freq: 62, dur: 0.6, type: 'sine', vol: 0.24, slide: 20 }));
    later(140, () => tone({ freq: 44, dur: 0.5, type: 'sine', vol: 0.16, slide: 18 }));
  },
  // 오브 사용 준비 — 반짝이는 상승음
  orbReady() {
    [523, 784, 1047].forEach((f, i) =>
      later(i * 55, () => tone({ freq: f, dur: 0.18, type: 'triangle', vol: 0.13, attack: 0.006 })));
  },
  // 게이지가 막 100이 됐을 때
  gaugeFull() {
    [659, 880].forEach((f, i) =>
      later(i * 90, () => tone({ freq: f, dur: 0.22, type: 'triangle', vol: 0.14, attack: 0.01 })));
  },
  click() { tone({ freq: 620, dur: 0.05, type: 'triangle', vol: 0.09, attack: 0.003 }); },
  tick()  { tone({ freq: 720, dur: 0.07, type: 'triangle', vol: 0.11, attack: 0.004 }); },
  // 도-미-솔-도 (부드러운 삼각파로)
  win()   { [523, 659, 784, 1047].forEach((f, i) =>
              later(i * 115, () => tone({ freq: f, dur: 0.24, type: 'triangle', vol: 0.16, attack: 0.012 }))); },
  // 라-파-도 하강 (톱니파는 거칠어서 삼각파로 바꿈)
  lose()  { [415, 349, 262].forEach((f, i) =>
              later(i * 175, () => tone({ freq: f, dur: 0.34, type: 'triangle', vol: 0.15, attack: 0.02 }))); },
};

// 파워 충전음은 계속 이어져야 해서(끊긴 "삑삑"이 아니라) 따로 관리합니다.
// 이전엔 사각파가 그대로 나가 귀에 거슬렸습니다. 지금은 삼각파 + 별도 필터를 거쳐
// 부드럽게 나가고, 볼륨도 파워가 올라야 서서히 커집니다.
let chargeOsc = null, chargeGain = null, chargeFilter = null;
function startChargeSound() {
  if (muted || !audioCtx || chargeOsc) return;
  const t = audioCtx.currentTime;
  chargeOsc = audioCtx.createOscillator();
  chargeGain = audioCtx.createGain();
  chargeFilter = audioCtx.createBiquadFilter();
  chargeFilter.type = 'lowpass';
  chargeFilter.frequency.value = 1100;
  chargeOsc.type = 'triangle';
  chargeOsc.frequency.setValueAtTime(120, t);
  chargeGain.gain.setValueAtTime(0.0001, t);
  chargeGain.gain.linearRampToValueAtTime(0.05, t + 0.04);   // 스르륵 커짐
  chargeOsc.connect(chargeFilter).connect(chargeGain).connect(masterFilter);
  chargeOsc.start(t);
}
// 파워가 오를수록 음이 높아집니다 — 화면을 안 봐도 귀로 파워를 가늠할 수 있습니다
function updateChargeSound(powerVal) {
  if (!chargeOsc || !audioCtx) return;
  const t = audioCtx.currentTime;
  const r = powerVal / CONFIG.powerMax;
  // 120Hz → 430Hz. 예전(150→700Hz)보다 훨씬 낮게 잡아 고음이 찌르지 않습니다
  chargeOsc.frequency.setTargetAtTime(120 + r * 310, t, 0.02);
  chargeFilter.frequency.setTargetAtTime(900 + r * 900, t, 0.05);
  chargeGain.gain.setTargetAtTime(0.04 + r * 0.05, t, 0.05);   // 파워가 찰수록 살짝 커짐
}
function stopChargeSound() {
  if (!chargeOsc || !audioCtx) return;
  const t = audioCtx.currentTime;
  chargeGain.gain.cancelScheduledValues(t);
  chargeGain.gain.setValueAtTime(Math.max(0.0002, chargeGain.gain.value), t);
  chargeGain.gain.exponentialRampToValueAtTime(0.0001, t + 0.06);
  chargeOsc.stop(t + 0.08);
  chargeOsc = null; chargeGain = null; chargeFilter = null;
}

// 포탄이 날아가는 동안 나는 "쉬이익" 소리.
// 포탄이 빠르게 떨어질수록 음이 낮아져서, 눈으로 안 봐도 지금 포탄이
// 올라가는 중인지 떨어지는 중인지 귀로 알 수 있습니다.
let flyNoise = null, flyGain = null, flyFilter = null;
function startFlySound() {
  if (muted || !audioCtx || flyNoise) return;
  const t = audioCtx.currentTime;
  // 2초짜리 잡음을 만들어 계속 반복 재생합니다 (바람 가르는 소리의 재료)
  const len = Math.floor(audioCtx.sampleRate * 2);
  const buf = audioCtx.createBuffer(1, len, audioCtx.sampleRate);
  const data = buf.getChannelData(0);
  for (let i = 0; i < len; i++) data[i] = Math.random() * 2 - 1;
  flyNoise = audioCtx.createBufferSource();
  flyNoise.buffer = buf;
  flyNoise.loop = true;
  // 대역통과 필터: 특정 높이 주변만 남겨서 "쉬이익" 하는 바람 소리를 만듭니다
  flyFilter = audioCtx.createBiquadFilter();
  flyFilter.type = 'bandpass';
  flyFilter.frequency.value = 900;
  flyFilter.Q.value = 1.4;
  flyGain = audioCtx.createGain();
  flyGain.gain.setValueAtTime(0.0001, t);
  flyGain.gain.linearRampToValueAtTime(0.05, t + 0.06);
  flyNoise.connect(flyFilter).connect(flyGain).connect(masterFilter);
  flyNoise.start(t);
}
function updateFlySound(b) {
  if (!flyNoise || !audioCtx) return;
  const t = audioCtx.currentTime;
  const speed = Math.sqrt(b.vx * b.vx + b.vy * b.vy);
  // 떨어지는 중(vy>0)이면 음을 낮춰 "떨어진다"는 느낌을 줍니다
  const target = 1100 - b.vy * 55;
  flyFilter.frequency.setTargetAtTime(Math.max(260, Math.min(1600, target)), t, 0.08);
  flyGain.gain.setTargetAtTime(Math.min(0.075, 0.02 + speed * 0.006), t, 0.08);
}
function stopFlySound() {
  if (!flyNoise || !audioCtx) return;
  const t = audioCtx.currentTime;
  flyGain.gain.cancelScheduledValues(t);
  flyGain.gain.setValueAtTime(Math.max(0.0002, flyGain.gain.value), t);
  flyGain.gain.exponentialRampToValueAtTime(0.0001, t + 0.05);
  flyNoise.stop(t + 0.07);
  flyNoise = null; flyGain = null; flyFilter = null;
}

function toggleMute() {
  muted = !muted;
  localStorage.setItem('fortress_muted', muted ? '1' : '0');
  if (muted) { stopChargeSound(); stopFlySound(); }
}

// ---------- 탱크 3종 ----------
// 단순히 색만 다른 게 아니라 "한 방"과 "맞추기 쉬움"을 교환합니다.
// dmg × 필요타수가 비슷하도록 맞춰 어느 걸 골라도 손해가 없게 했습니다.
const TANKS = [
  { name: '레이븐',  desc: '균형형 — 무난하고 정직한 주력기',
    color: '#4ec9f5', dmg: 58, radius: 35,
    trail: '#ffe680', expl: ['#ff9d2e', '#ffe15c'], shell: 3, shake: 9 },

// ---------- 지형 ----------
let terrain = new Array(W);

function generateTerrain() {
  const base = GROUND_H * 0.7;
  const s1 = Math.random() * 1000, s2 = Math.random() * 1000, s3 = Math.random() * 1000;
  const t = map.t;
  for (let x = 0; x < W; x++) {
    let h = base;
    h += Math.sin((x + s1) * t.f1) * t.a1;
    h += Math.sin((x + s2) * t.f2) * t.a2;
    h += Math.sin((x + s3) * t.f3) * t.a3;
    terrain[x] = Math.max(130, Math.min(GROUND_H - 26, Math.round(h)));
  }
}

// ---------- 대포 ----------
const player = {
  x: 110, y: 0, angle: 45, hp: CONFIG.maxHp,

  recoil: 0,            // 발사 반동 (포신이 뒤로 밀렸다 돌아옴)
  wheelSpin: 0,         // 바퀴 회전량 (이동하면 굴러갑니다)
  bob: 0,               // 이동 중 덜컹거림
  drawAngle: 45,        // 화면에 보이는 포신 각도 (실제 각도를 부드럽게 따라감)

const enemy = {

// 땅의 기울기를 구합니다. 대포가 경사면 위에서 수평으로 떠 있으면 어색하므로
// 양옆 8px의 높이 차로 각도를 계산해 몸체를 기울입니다.
function terrainAngle(x) {
  const xi = Math.round(x);
  const l = terrain[Math.max(0, xi - 8)];
  const r = terrain[Math.min(W - 1, xi + 8)];
  const a = Math.atan2(r - l, 16);
  return Math.max(-0.5, Math.min(0.5, a));   // ±약 29도까지만 (절벽에서 뒤집히지 않게)
}

function placeTanks() {
  for (const t of [player, enemy]) {
    t.y = terrain[Math.round(t.x)];
    t.tilt = terrainAngle(t.x);
  }
}

// ---------- 발사 종류 (원조 포트리스의 1번·2번·오브) ----------
// 1번(기본샷): 포탄 하나. 언제든 쏠 수 있습니다.
// 2번(더블샷): 각도를 살짝 벌린 포탄 두 발. 하나는 빗나가도 하나가 맞을 확률이 있어
//              "대충 근처"를 노릴 때 유리하지만, 발당 위력은 약합니다.
// 오브(SS샷) : 게이지를 가득 모아야 쓰는 필살기. 강력한 한 방 + 넓은 폭발.
const SHOTS = {
  single: { key: '1', name: '1번', dmgMul: 1.0,  radiusMul: 1.0,  count: 1, spread: 0,   gauge: 0   },
  // 퍼짐·위력은 40판씩 시뮬레이션해 맞춘 값입니다.
  // 정확히 조준했을 땐 1번보다 약간 손해(27.5 vs 30.8), 빗나갔을 땐 이득(12.9 vs 10.7)이
  // 되도록 맞췄습니다 — 그래야 "대충 근처를 노릴 때 쓰는 카드"가 됩니다.
  double: { key: '2', name: '2번', dmgMul: 0.72, radiusMul: 0.85, count: 2, spread: 1.2, gauge: 0   },
  // 위력 1.45배 + 상한 82. 상한이 없으면 매머드 오브가 100 데미지라
  // 풀피 상대를 한 방에 죽여서 "게이지만 모으면 이기는" 게임이 됩니다.
  orb:    { key: 'S', name: '오브', dmgMul: 1.45, radiusMul: 1.5, count: 1, spread: 0,   gauge: 100,
            dmgCap: 82 },
};

// ---------- 포탄 ----------
// 더블샷 때문에 포탄이 동시에 여러 개 날아갈 수 있어 배열로 관리합니다.
let bullets = [];

// 포탄을 한 스텝(1/120초)만큼 움직이는 함수.
// 실제 게임의 포탄과 AI가 머릿속으로 굴려보는 포탄이 반드시 똑같이 날아가야 하므로
// 물리 계산은 여기 한 곳에만 둡니다. (여길 고치면 양쪽이 함께 바뀝니다)
function stepProjectile(b) {
  b.x += b.vx;
  b.y += b.vy;
  b.vy += CONFIG.gravity;
  b.vx += wind;              // 바람이 옆으로 밀어냄
}

function fire(shooter, angle, powerVal, who, shotType = 'single') {
  const shot = SHOTS[shotType];
  const stats = who === 'player' ? player.stats : enemy.stats;
  const speed = powerVal * CONFIG.powerScale;

  bullets = [];
  // count가 2면 각도를 ±spread만큼 벌려 두 발을 쏩니다
  for (let i = 0; i < shot.count; i++) {
    const offset = shot.count === 1 ? 0
                 : (i - (shot.count - 1) / 2) * shot.spread * 2;
    const rad = (angle + offset) * Math.PI / 180;
    bullets.push({
      x: shooter.x + Math.cos(rad) * 22,
      y: shooter.y - 14 - Math.sin(rad) * 22,
      vx: Math.cos(rad) * speed,
      vy: -Math.sin(rad) * speed,
      trail: [], who, shotType,
      color: shotType === 'orb' ? '#ffe680' : stats.trail,
      // 포탄을 훨씬 크게 (예전엔 3~5px 네모라 밋밋했습니다)
      size: (shotType === 'orb' ? stats.shell + 5 : stats.shell + 2.5),
      spin: 0,             // 포탄이 회전합니다
      age: 0,              // 날아간 시간 (꼬리 길이·발광에 씀)
      smokeTick: 0,        // 연기를 뿜는 주기
    });
  }

  // 발사 순간의 불꽃(머즐 플래시)
  // --- 발사 순간 연출 ---
  const b0 = bullets[0];
  const rad0 = angle * Math.PI / 180;
  const isOrb = shotType === 'orb';

  // 머즐 플래시 (커졌습니다)
  flashes.push({ x: b0.x, y: b0.y, life: isOrb ? 16 : 10, maxLife: isOrb ? 16 : 10,
                 color: isOrb ? '#ffe680' : stats.trail,
                 size: isOrb ? 2.2 : 1.4 });

  // 포구에서 뿜어나오는 불꽃 — 포신 방향으로 부채꼴로 퍼집니다
  const blastN = isOrb ? 22 : 14;
  for (let i = 0; i < blastN; i++) {
    const spreadA = rad0 + (Math.random() - 0.5) * 0.85;
    const sp = (1.6 + Math.random() * 4.2) * (isOrb ? 1.5 : 1);
    sparks.push({
      x: b0.x, y: b0.y,
      vx: Math.cos(spreadA) * sp,
      vy: -Math.sin(spreadA) * sp,
      life: 1, size: 2 + Math.random() * 2,
      decay: 0.05, gravity: 0.06,
      color: isOrb ? (Math.random() < 0.5 ? '#ffd34e' : '#fff6c9')
                   : (Math.random() < 0.5 ? stats.expl[0] : stats.trail),
    });
  }
  // 포구 연기 구름
  for (let i = 0; i < (isOrb ? 8 : 5); i++) {
    smoke.push({
      x: b0.x + (Math.random() - 0.5) * 6,
      y: b0.y + (Math.random() - 0.5) * 6,
      vx: Math.cos(rad0) * (0.5 + Math.random()) + (Math.random() - 0.5) * 0.5,
      vy: -Math.sin(rad0) * (0.5 + Math.random()) - 0.2,
      r: 4 + Math.random() * 5, life: 1, decay: 0.022,
      color: isOrb ? '255,235,180' : '210,210,220',
    });
  }
  // 발사 반동으로 화면이 살짝 흔들립니다
  shake = Math.max(shake, isOrb ? 7 : 3.5);

  // 발사 반동 — 파워가 셀수록, 오브일수록 크게 밀립니다
  shooter.recoil = (5 + powerVal * 0.06) * (shotType === 'orb' ? 1.8 : 1);
  shooter.bob = shooter.recoil * 0.35;
  if (shotType === 'orb') SFX.orb(stats); else SFX.fire(stats);
  startFlySound();     // 포탄이 날아가는 동안 "쉬이익" 소리가 이어집니다

  // 내 발사 기록 (HUD 힌트용)
  if (who === 'player') {
    myLastShot = { angle: Math.round(angle), power: Math.round(powerVal), shot: shotType };
    if (shotType === 'orb') player.gauge = 0;      // 오브를 쓰면 게이지 소진
  } else if (shotType === 'orb') {
    enemy.gauge = 0;
  }
  phase = 'flying';
}

// ---------- 폭발 ----------
let explosions = [];
let sparks = [];        // 폭발 파편
let flashes = [];       // 발사 불꽃
let damageTexts = [];
let confetti = [];      // 승리 폭죽
let shockwaves = [];    // 폭발 충격파 고리 (스톰·오브)
let smoke = [];         // 포탄이 지나간 자리에 남는 연기
let screenFlash = 0;    // 오브 착탄 시 화면 전체가 번쩍이는 정도

function createExplosion(x, y, who, shotType = 'single') {
  const base = who === 'player' ? player.stats : enemy.stats;
  const shot = SHOTS[shotType];
  // 발사 종류에 따라 위력과 폭발 크기가 달라집니다 (2번은 약하게, 오브는 강하게)
  const stats = {
    ...base,
    dmg: base.dmg * shot.dmgMul,
    radius: base.radius * shot.radiusMul,
    dmgCap: shot.dmgCap,
    expl: shotType === 'orb' ? ['#ffd34e', '#fff6c9'] : base.expl,
  };

  explosions.push({ x, y, radius: 0, life: 1, maxR: stats.radius, colors: stats.expl });
  shake = base.shake * (shotType === 'orb' ? 1.8 : shot.dmgMul);
  if (shotType === 'orb') SFX.orbHit(base); else SFX.explode(base);

  // 착탄 순간의 흰 섬광 — "쿵" 하고 터진 느낌을 만듭니다
  flashes.push({ x, y, life: shotType === 'orb' ? 14 : 9,
                 maxLife: shotType === 'orb' ? 14 : 9,
                 color: stats.expl[1],
                 size: (stats.radius / 35) * (shotType === 'orb' ? 2.4 : 1.6) });

  // 피어오르는 연기 기둥
  const smokeN = Math.round(stats.radius / 4) + (shotType === 'orb' ? 8 : 0);
  for (let i = 0; i < smokeN; i++) {
    const a = Math.random() * Math.PI * 2;
    const d = Math.random() * stats.radius * 0.7;
    smoke.push({
      x: x + Math.cos(a) * d,
      y: y + Math.sin(a) * d * 0.5,
      vx: Math.cos(a) * (0.3 + Math.random() * 0.8),
      vy: -0.3 - Math.random() * 0.9,
      r: 5 + Math.random() * 8, life: 1, decay: 0.012,
      color: shotType === 'orb' ? '255,225,160' : '120,115,120',
    });
  }

  // 화면 전체가 번쩍 (오브만) — 필살기라는 게 확실히 느껴지게
  if (shotType === 'orb') screenFlash = 0.55;

  // 파편 — 기종마다 튀는 모양이 다릅니다
  //   매머드: 적고 무거운 파편이 느리게, 멀리   (묵직한 폭발)
  //   스톰  : 많고 가벼운 파편이 넓게 흩날림     (광역 폭발)
  //   레이븐: 그 중간
  const kind = TANKS.indexOf(base);
  const burst = shotType === 'orb' ? 34 : kind === 1 ? 13 : kind === 2 ? 26 : 18;
  for (let i = 0; i < burst; i++) {
    const a = Math.random() * Math.PI * 2;
    const sp = kind === 1 ? 1.2 + Math.random() * 3.0        // 매머드: 느리고 무겁게
             : kind === 2 ? 2.2 + Math.random() * 5.0        // 스톰: 빠르고 넓게
             : 1.5 + Math.random() * 3.5;
    sparks.push({
      x, y,
      vx: Math.cos(a) * sp * (shotType === 'orb' ? 1.4 : 1),
      vy: Math.sin(a) * sp - 2,
      life: 1,
      // 매머드 파편은 크고 오래 남고, 스톰 파편은 작고 금방 사라집니다
      size: kind === 1 ? 4 : kind === 2 ? 2 : 3,
      decay: kind === 1 ? 0.016 : kind === 2 ? 0.03 : 0.022,
      gravity: kind === 1 ? 0.2 : kind === 2 ? 0.09 : 0.15,
      color: shotType === 'orb'
           ? (Math.random() < 0.5 ? '#ffd34e' : '#fff6c9')
           : (Math.random() < 0.5 ? stats.expl[0] : stats.expl[1]),
    });
  }

  // 스톰은 폭발 뒤에 먼지 고리가 퍼집니다 (광역형이라는 게 눈에 보이게)
  if (kind === 2) {
    shockwaves.push({ x, y, r: stats.radius * 0.4, maxR: stats.radius * 2.2, life: 1,
                      color: 'rgba(201,166,255,' });
  } else if (shotType === 'orb') {
    shockwaves.push({ x, y, r: stats.radius * 0.5, maxR: stats.radius * 2.6, life: 1,
                      color: 'rgba(255,230,140,' });
  }

  if (who === 'player') lastPlayerHit = { x, y };

  // 데미지 (쏜 쪽의 스탯으로 계산 — 자기 포탄에 자기도 다칠 수 있음).
  // 단, 자폭은 절반만 아프고 "자폭!" 이라고 알려줍니다.
  // 초보자가 각도를 잘못 잡아 코앞에 떨어뜨렸을 때 영문도 모르고 체력이 깎이면 억울하니까요.
  const shooter = who === 'player' ? player : enemy;
  applyDamage(player, x, y, stats, player === shooter);
  applyDamage(enemy,  x, y, stats, enemy  === shooter);

  // 땅 파기
  const r = stats.radius;
  for (let i = Math.round(x - r); i <= Math.round(x + r); i++) {
    if (i < 0 || i >= W) continue;
    const dx = i - x;
    const depth = Math.sqrt(Math.max(0, r * r - dx * dx));
    const newY = y + depth;
    // 바닥은 암반이라 더 못 팝니다. HUD(500)에 닿지 않게 여유를 둡니다.
    if (newY > terrain[i]) terrain[i] = Math.min(GROUND_H - 14, newY);
  }
  placeTanks();
}

// 게이지를 올리고, 방금 100이 찼으면 알려줍니다
function addGauge(tank, amount) {
  const before = tank.gauge;
  tank.gauge = Math.min(CONFIG.gaugeMax, tank.gauge + amount);
  if (before < CONFIG.gaugeMax && tank.gauge >= CONFIG.gaugeMax) {
    if (tank === player) { SFX.gaugeFull(); showMessage('오브 준비 완료! (S)', 70); }
  }
}

function applyDamage(tank, ex, ey, stats, isSelf = false) {
  const dx = tank.x - ex;
  const dy = (tank.y - 8) - ey;
  const dist = Math.sqrt(dx * dx + dy * dy);
  if (dist > stats.radius) return;

  const ratio = dist / stats.radius;
  let dmg = Math.round(stats.dmg * (1 - ratio) * (1 - ratio * 0.5));
  if (stats.dmgCap) dmg = Math.min(dmg, stats.dmgCap);   // 오브 한 방 즉사 방지
  if (isSelf) dmg = Math.round(dmg * CONFIG.selfDamage);
  if (dmg > 0) {
    tank.hp = Math.max(0, tank.hp - dmg);
    damageTexts.push({ x: tank.x, y: tank.y - 30, value: dmg, life: 1, self: isSelf });
    if (tank === player) SFX.hit();     // 내가 맞았을 때만 경고음

    // 오브 게이지: 맞힌 쪽은 많이, 맞은 쪽도 조금 찹니다 (지고 있어도 역전 기회)
    if (!isSelf) {
      const attacker = tank === player ? enemy : player;
      addGauge(attacker, CONFIG.gaugePerHit);
    }
    addGauge(tank, CONFIG.gaugeWhenHurt);
  }
}

// ---------- 배경 장식 (바람이 눈에 보이게) ----------
// 바람 줄기: 하늘을 가로질러 흐르는 짧은 선. 바람 방향·세기 그대로 움직입니다.
let windStreaks = [];
for (let i = 0; i < 26; i++) {
  windStreaks.push({ x: Math.random() * W, y: 40 + Math.random() * (GROUND_H - 180) });
}
// 구름(초원) / 별·달(사막) / 눈(설원)
let clouds = [];
let stars = [];
let snowflakes = [];

function initDeco() {
  clouds = []; stars = []; snowflakes = [];
  if (map.deco === 'clouds') {
    for (let i = 0; i < 5; i++) {
      clouds.push({ x: Math.random() * W, y: 40 + Math.random() * 150,
                    s: 0.7 + Math.random() * 0.9 });
    }
  } else if (map.deco === 'stars') {
    for (let i = 0; i < 70; i++) {
      stars.push({ x: Math.random() * W, y: Math.random() * (GROUND_H - 160),
                   b: 0.3 + Math.random() * 0.7 });
    }
  } else if (map.deco === 'snow') {
    for (let i = 0; i < 60; i++) {
      snowflakes.push({ x: Math.random() * W, y: Math.random() * GROUND_H,
                        vy: 0.4 + Math.random() * 0.8 });
    }
  }
}

// ---------- 입력 ----------
const keys = {};
let charging = false;
let power = 0;
let selShot = 'single';    // 지금 고른 발사 종류 (1 / 2 / S 키로 변경)

window.addEventListener('keydown', (e) => {
  if (e.code === 'Space') e.preventDefault();
  initAudio();                       // 첫 키 입력에 오디오를 깨웁니다

  // 음소거는 S가 오브 발사에 쓰이므로 X 키로 옮겼습니다
  if (e.code === 'KeyX') { toggleMute(); if (!muted) SFX.click(); return; }

  // --- 메뉴 화면 조작 ---
  if (phase === 'menu') {
    // 줄마다 칸 수가 다릅니다: 내 탱크 3 / 상대 탱크 4(무작위 포함) / 맵 3
    const counts = [3, 4, 3];
    const move = (dir) => {
      const n = counts[menuRow];
      if (menuRow === 0)      selTank  = (selTank  + dir + n) % n;
      else if (menuRow === 1) selEnemy = (selEnemy + dir + n) % n;
      else                    selMap   = (selMap   + dir + n) % n;
      SFX.click();
    };
    if (e.code === 'ArrowLeft')  move(-1);
    if (e.code === 'ArrowRight') move(1);
    if (e.code === 'ArrowUp')    { menuRow = (menuRow + 2) % 3; SFX.click(); }
    if (e.code === 'ArrowDown')  { menuRow = (menuRow + 1) % 3; SFX.click(); }
    if (e.code === 'Enter' || e.code === 'Space') startGame();
    return;
  }

  if (e.code === 'Space') {
    if (phase === 'aiming' && turn === 'player' && !charging) {
      charging = true; power = 0;
      startChargeSound();
    }
    return;
  }
  keys[e.code] = true;

  // --- 발사 종류 고르기 (원조 포트리스의 1번·2번·SS) ---
  if (phase === 'aiming' && turn === 'player' && !charging) {
    if (e.code === 'Digit1') { selShot = 'single'; SFX.click(); }
    if (e.code === 'Digit2') { selShot = 'double'; SFX.click(); }
    if (e.code === 'KeyS') {
      if (player.gauge >= CONFIG.gaugeMax) { selShot = 'orb'; SFX.orbReady(); }
      else showMessage('오브 게이지가 부족합니다', 60);
    }
  }

  if (e.code === 'KeyH') showHint = !showHint;
  if (e.code === 'KeyR') newGame();               // 같은 탱크·맵으로 재대결
  if (e.code === 'KeyM') { phase = 'menu'; bullets = []; stopChargeSound(); stopFlySound(); }
});

window.addEventListener('keyup', (e) => {
  if (e.code === 'Space') {
    e.preventDefault();
    if (charging) {
      charging = false;
      stopChargeSound();
      // 오브를 골라뒀는데 게이지가 없으면(전 턴에 써버린 경우) 기본샷으로 나갑니다
      const use = (selShot === 'orb' && player.gauge < CONFIG.gaugeMax) ? 'single' : selShot;
      fire(player, player.angle, power, 'player', use);
      if (use === 'orb') selShot = 'single';    // 오브는 한 번 쓰면 기본샷으로 돌아옴
      power = 0;
    }
    return;
  }
  keys[e.code] = false;
});

// 창을 벗어나면 충전·이동 키를 모두 취소 (게이지 걸림 방지)
window.addEventListener('blur', () => {
  charging = false; power = 0;
  stopChargeSound();
  for (const k in keys) keys[k] = false;
  // 포탄 소리는 멈추지 않습니다 — 창을 벗어나도 포탄은 계속 날아가는 중이므로
});

// 메뉴에서 마우스 클릭으로도 선택 가능
canvas.addEventListener('click', (e) => {
  initAudio();                       // 첫 클릭에도 오디오를 깨웁니다
  if (phase !== 'menu') return;
  const mx = e.offsetX, my = e.offsetY;
  const inside = (r) => mx >= r.x && mx <= r.x + r.w && my >= r.y && my <= r.y + r.h;
  for (let i = 0; i < 4; i++) {
    if (i < 3) {
      if (inside(tankCardRect(i))) { selTank = i; menuRow = 0; SFX.click(); return; }
      if (inside(mapCardRect(i)))  { selMap  = i; menuRow = 2; SFX.click(); return; }
    }
    if (inside(enemyCardRect(i)))  { selEnemy = i; menuRow = 1; SFX.click(); return; }
  }
  const b = startBtnRect();
  if (mx >= b.x && mx <= b.x + b.w && my >= b.y && my <= b.y + b.h) startGame();
});

// ---------- AI 조준 ----------
// 게임과 완전히 같은 물리(바람 포함)로 미리 날려보는 방식.
// 교과서 공식은 프레임 단위 계산과 어긋나 실제로 165px나 빗나갔기 때문입니다.
function simulateLanding(from, angleDeg, powerVal) {
  const rad = angleDeg * Math.PI / 180;
  const speed = powerVal * CONFIG.powerScale;
  // 실제 발사와 똑같은 시작 위치·속도로 가짜 포탄을 하나 만듭니다
  const b = {
    x: from.x + Math.cos(rad) * 22,
    y: from.y - 14 - Math.sin(rad) * 22,
    vx: Math.cos(rad) * speed,
    vy: -Math.sin(rad) * speed,
  };

  for (let i = 0; i < 3000; i++) {
    stepProjectile(b);          // 실제 포탄과 완전히 같은 물리
    const dx = b.x - player.x, dy = b.y - (player.y - 10);
    if (Math.sqrt(dx * dx + dy * dy) < CONFIG.hitRadius) return b.x;
    if (b.x < -50 || b.x > W + 50 || b.y > GROUND_H + 140) return b.x;
    if (b.y >= 0) {
      const gx = Math.round(b.x);
      if (gx >= 0 && gx < W && b.y >= terrain[gx]) return b.x;
    }
  }
  return b.x;
}

// 목표 지점에 맞는 파워를 절반씩 좁혀가며 찾기 (이분 탐색)
function findPowerFor(angleDeg, targetX) {
  let low = 15, high = CONFIG.powerMax;
  let bestPower = null, bestDist = Infinity;
  for (let i = 0; i < 24; i++) {
    const mid = (low + high) / 2;
    const landX = simulateLanding(enemy, angleDeg, mid);
    const dist = Math.abs(landX - targetX);
    if (dist < bestDist) { bestDist = dist; bestPower = mid; }
    if (landX > targetX) low = mid; else high = mid;
  }
  if (bestDist > 60) return null;
  return bestPower;
}

function aiDecideShot() {
  // 쏠수록 오차(손떨림)가 줄어듭니다: 320px → 208 → 135 → ... → 최소 32px
  let errorSize = CONFIG.aiFirstError * Math.pow(CONFIG.aiErrorDecay, enemy.shotCount);
  errorSize = Math.max(CONFIG.aiMinError, errorSize);

  const jitter = (Math.random() * 2 - 1) * errorSize;
  const targetX = player.x + jitter;

  let best = null;
  for (let a = 100; a <= 170; a += 3) {
    const p = findPowerFor(a, targetX);
    if (p === null) continue;
    const landX = simulateLanding(enemy, a, p);
    const dist = Math.abs(landX - targetX);
    const score = dist + Math.abs(a - 135) * 0.1;
    if (!best || score < best.score) best = { angle: a, power: p, score };
  }
  if (!best) best = { angle: 135, power: 70 };

  const finalPower = Math.max(15, Math.min(CONFIG.powerMax, best.power));
  enemy.shotCount++;
  enemy.lastAngle = best.angle;
  enemy.lastPower = finalPower;

  // AI도 발사 종류를 고릅니다.
  // 오브가 준비되면 씁니다. 아직 조준이 부정확한 초반에는 2번(더블샷)으로
  // 넓게 노리고, 조준이 잡히면 1번으로 정확히 때립니다 — 사람이 하는 방식과 같습니다.
  let shotType = 'single';
  if (enemy.gauge >= CONFIG.gaugeMax) {
    shotType = 'orb';
  } else if (errorSize > 90) {
    shotType = 'double';
  }
  return { angle: best.angle, power: finalPower, shotType };
}

// ---------- 턴 ----------
function nextTurn() {
  if (player.hp <= 0 || enemy.hp <= 0) {
    phase = 'gameover';
    winner = (enemy.hp <= 0 && player.hp > 0) ? 'player'
           : (player.hp <= 0 && enemy.hp > 0) ? 'enemy' : 'draw';
    if (winner === 'player') { spawnConfetti(); SFX.win(); } else SFX.lose();
    return;
  }

  rollWind();   // 턴마다 바람이 새로 붑니다

  if (turn === 'player') {
    turn = 'enemy';
    phase = 'aiThink';
    aiTimer = CONFIG.aiThinkTime;
    addGauge(enemy, CONFIG.gaugePerTurn);
    // AI도 절반 확률로 자리를 옮깁니다 (같은 자리 싸움 방지).
    // 플레이어와 똑같이 연료 한도(fuelMax) 안에서만 움직입니다.
    enemy.fuel = CONFIG.fuelMax;
    if (Math.random() < 0.5) {
      const delta = (20 + Math.random() * (CONFIG.fuelMax - 20)) * (Math.random() < 0.5 ? -1 : 1);
      enemy.moveTarget = Math.max(W * 0.55, Math.min(W - 30, enemy.x + delta));
    } else {
      enemy.moveTarget = null;
    }
    showMessage('적의 차례', 50);
  } else {
    turn = 'player';
    phase = 'aiming';
    player.fuel = CONFIG.fuelMax;   // 연료는 매 턴 가득 찹니다
    addGauge(player, CONFIG.gaugePerTurn);
    turnTimer = CONFIG.turnTime * 120;
    lastTickSecond = -1;
    showMessage('내 차례', 50);
  }
}

function showMessage(text, duration) { message = text; messageTimer = duration; }

function spawnConfetti() {
  const palette = ['#ffd700', '#4ec9f5', '#f56b6b', '#7ec850', '#c9a6ff'];
  for (let i = 0; i < 90; i++) {
    confetti.push({
      x: Math.random() * W,
      y: -20 - Math.random() * 150,
      vy: 1 + Math.random() * 1.6,
      vx: (Math.random() * 2 - 1) * 0.8,
      size: 3 + Math.random() * 3,
      color: palette[i % palette.length],
      spin: Math.random() * Math.PI,
    });
  }
}

// ---------- 게임 시작 ----------
function startGame() {
  player.stats = TANKS[selTank];
  // 상대 기종: 0~2은 지정, 3은 무작위
  enemy.stats  = selEnemy === 3
    ? TANKS[Math.floor(Math.random() * TANKS.length)]
    : TANKS[selEnemy];
  map = MAPS[selMap];
  newGame();
}

function newGame() {
  generateTerrain();
  initDeco();

  player.hp = CONFIG.maxHp; player.x = 110; player.angle = 45;
  player.fuel = CONFIG.fuelMax; player.gauge = 0;
  enemy.hp = CONFIG.maxHp; enemy.x = 690; enemy.angle = 135;
  enemy.fuel = CONFIG.fuelMax; enemy.gauge = 0;
  selShot = 'single';
  enemy.lastPower = null; enemy.lastAngle = null;
  enemy.shotCount = 0; enemy.moveTarget = null;
  placeTanks();

  bullets = [];
  explosions = []; sparks = []; flashes = []; damageTexts = []; confetti = [];
  shockwaves = []; smoke = []; screenFlash = 0;
  charging = false; power = 0;
  lastPlayerHit = null; myLastShot = null;
  shake = 0;
  rollWind();

  turn = 'player';
  phase = 'aiming';
  winner = null;
  turnTimer = CONFIG.turnTime * 120;
  lastTickSecond = -1;
  stopChargeSound();
  stopFlySound();
  showMessage('내 차례', 60);
}

// ---------- 갱신 ----------
function update() {
  if (phase === 'menu') return;

  if (messageTimer > 0) messageTimer--;
  updateAmbient();
  updateTankMotion();

  if (phase === 'gameover') { updateEffects(); return; }

  // --- 플레이어 조작: ←→ 이동, ↑↓ 각도 ---
  if (phase === 'aiming' && turn === 'player') {
    // 제한 시간 카운트다운. 파워를 충전하는 중에는 멈춥니다
    // (충전하다 시간이 끊겨 억울하게 턴을 넘기는 상황 방지)
    if (!charging) {
      turnTimer--;
      const sec = Math.ceil(turnTimer / 120);
      if (sec <= 5 && sec > 0 && sec !== lastTickSecond) {   // 5초 이하면 매초 경고음
        lastTickSecond = sec;
        SFX.tick();
      }
      if (turnTimer <= 0) {          // 시간 초과 — 발사 없이 턴 넘김
        showMessage('시간 초과!', 60);
        nextTurn();
        return;
      }
    }

    if (keys['ArrowUp'])   player.angle = Math.min(170, player.angle + CONFIG.angleSpeed);
    if (keys['ArrowDown']) player.angle = Math.max(10,  player.angle - CONFIG.angleSpeed);

    // 좌우 이동 — 방향만 다르고 나머지는 같아서 한 덩어리로 묶었습니다
    const dir = keys['ArrowLeft'] ? -1 : keys['ArrowRight'] ? 1 : 0;
    if (dir !== 0 && player.fuel > 0) {
      const nx = player.x + dir * CONFIG.moveSpeed;
      // 왼쪽 끝 25, 오른쪽은 화면 60%까지 (적 진영까지는 못 감)
      player.x = Math.max(25, Math.min(W * 0.6, nx));
      player.fuel = Math.max(0, player.fuel - CONFIG.moveSpeed);
      player.y = terrain[Math.round(player.x)];
      player.wheelSpin += dir * 0.13;          // 바퀴가 굴러갑니다
      player.bob = Math.sin(player.wheelSpin * 3) * 1.1;   // 울퉁불퉁한 땅에 덜컹
    }
  }

  if (charging) {
    power = Math.min(CONFIG.powerMax, power + CONFIG.powerSpeed);
    updateChargeSound(power);       // 파워가 오를수록 소리가 높아집니다
  }

  // --- AI: 먼저 이동하고, 도착하면 생각이 끝난 뒤 발사 ---
  if (phase === 'aiThink') {
    if (enemy.moveTarget !== null && Math.abs(enemy.x - enemy.moveTarget) > 1.5 && enemy.fuel > 0) {
      const d = Math.sign(enemy.moveTarget - enemy.x);
      enemy.x += d * 0.9;
      enemy.fuel = Math.max(0, enemy.fuel - 0.9);    // 연료를 씁니다 (플레이어와 동일)
      enemy.y = terrain[Math.round(enemy.x)];
      enemy.wheelSpin += d * 0.1;
      enemy.bob = Math.sin(enemy.wheelSpin * 3) * 1.1;
    } else {
      enemy.moveTarget = null;
      aiTimer--;
      if (aiTimer <= 0) {
        const shot = aiDecideShot();
        enemy.angle = shot.angle;
        fire(enemy, shot.angle, shot.power, 'enemy', shot.shotType);
      }
    }
  }

  // --- 포탄 (더블샷이면 동시에 두 발이 날아갑니다) ---
  if (bullets.length > 0) {
    const alive = [];
    for (const b of bullets) {
      b.trail.push({ x: b.x, y: b.y });
      if (b.trail.length > 55) b.trail.shift();
      b.age++;
      b.spin += 0.16;

      // 날아가면서 연기를 뿜습니다 (오브는 더 자주·더 크게)
      const isOrb = b.shotType === 'orb';
      b.smokeTick++;
      if (b.smokeTick >= (isOrb ? 2 : 4)) {
        b.smokeTick = 0;
        smoke.push({
          x: b.x, y: b.y,
          vx: (Math.random() - 0.5) * 0.3 + wind * 12,
          vy: (Math.random() - 0.5) * 0.3 - 0.15,
          r: isOrb ? 4 + Math.random() * 3 : 2.5 + Math.random() * 2,
          life: 1, decay: isOrb ? 0.02 : 0.03,
          color: isOrb ? '255,225,150' : '200,200,210',
        });
      }

      stepProjectile(b);

      let done = false;
      // 대포에 직격
      for (const tank of [player, enemy]) {
        const dx = b.x - tank.x, dy = b.y - (tank.y - 10);
        if (Math.sqrt(dx * dx + dy * dy) < CONFIG.hitRadius) {
          createExplosion(b.x, b.y, b.who, b.shotType);
          done = true; break;
        }
      }
      // 화면 밖으로 사라짐 (터지지 않고 그냥 없어집니다)
      if (!done && (b.x < -50 || b.x > W + 50 || b.y > GROUND_H + 140)) {
        done = true;
      } else if (!done && b.y >= 0) {
        // 땅에 착탄
        const gx = Math.round(b.x);
        if (gx >= 0 && gx < W && b.y >= terrain[gx]) {
          createExplosion(b.x, b.y, b.who, b.shotType);
          done = true;
        }
      }
      if (!done) alive.push(b);
    }
    bullets = alive;

    if (bullets.length > 0) {
      updateFlySound(bullets[0]);      // 소리는 대표로 첫 번째 포탄을 따라갑니다
    } else {
      stopFlySound();
      nextTurn();                      // 모든 포탄이 사라져야 턴이 넘어갑니다
    }
  }

  updateEffects();
}

// 탱크의 움직임 갱신 (그림에만 영향, 게임 규칙과는 무관합니다)
function updateTankMotion() {
  for (const t of [player, enemy]) {
    // 발사 반동은 서서히 원래대로 돌아옵니다
    t.recoil *= 0.88;
    if (t.recoil < 0.05) t.recoil = 0;
    // 덜컹거림도 서서히 잦아듭니다
    t.bob *= 0.85;
    if (Math.abs(t.bob) < 0.05) t.bob = 0;
    // 포신은 실제 각도를 부드럽게 따라갑니다 (뚝뚝 끊기지 않게)
    const diff = t.angle - t.drawAngle;
    t.drawAngle += diff * 0.25;
    // 땅 기울기도 부드럽게 (크레이터가 파여도 갑자기 획 돌지 않게)
    const want = terrainAngle(t.x);
    t.tilt += (want - t.tilt) * 0.15;
  }
}

// 배경 장식 움직임 (바람의 방향이 여기서 보입니다)
function updateAmbient() {
  // 바람 줄기: 바람 세기에 비례해 흐름
  const sp = windLevel * 1.4;
  for (const s of windStreaks) {
    s.x += sp;
    if (s.x < -30) { s.x = W + 20; s.y = 40 + Math.random() * (GROUND_H - 180); }
    if (s.x > W + 30) { s.x = -20; s.y = 40 + Math.random() * (GROUND_H - 180); }
  }
  // 구름은 바람 + 자체 흐름으로 천천히
  for (const c of clouds) {
    c.x += windLevel * 0.15 + 0.05;
    if (c.x > W + 90) c.x = -90;
    if (c.x < -90) c.x = W + 90;
  }
  // 눈은 아래로 내리면서 바람에 비스듬히
  for (const f of snowflakes) {
    f.y += f.vy;
    f.x += windLevel * 0.5 + Math.sin(f.y * 0.02) * 0.3;
    if (f.y > GROUND_H) { f.y = -5; f.x = Math.random() * W; }
    if (f.x < 0) f.x += W;
    if (f.x > W) f.x -= W;
  }
}

function updateEffects() {
  for (let i = explosions.length - 1; i >= 0; i--) {
    const ex = explosions[i];
    // 처음엔 확 커졌다가 점점 느려집니다 (터지는 느낌이 훨씬 살아납니다)
    ex.radius += (ex.maxR * 1.15 - ex.radius) * 0.28;
    ex.life -= 0.035;
    if (ex.life <= 0) explosions.splice(i, 1);
  }
  for (let i = sparks.length - 1; i >= 0; i--) {
    const p = sparks[i];
    // 무게(gravity)와 사라지는 속도(decay)가 기종마다 다릅니다
    p.x += p.vx; p.y += p.vy; p.vy += (p.gravity ?? 0.15);
    p.vx *= 0.995;
    p.life -= (p.decay ?? 0.03);
    if (p.life <= 0) sparks.splice(i, 1);
  }
  // 연기는 천천히 퍼지며 위로 떠오릅니다
  for (let i = smoke.length - 1; i >= 0; i--) {
    const s = smoke[i];
    s.x += s.vx; s.y += s.vy;
    s.vy -= 0.004;          // 살짝 떠오름
    s.vx *= 0.97; s.vy *= 0.98;
    s.r += 0.22;            // 점점 커지며 흩어짐
    s.life -= s.decay;
    if (s.life <= 0) smoke.splice(i, 1);
  }
  // 충격파 고리는 빠르게 퍼지며 옅어집니다
  for (let i = shockwaves.length - 1; i >= 0; i--) {
    const w = shockwaves[i];
    w.r += (w.maxR - w.r) * 0.12;
    w.life -= 0.035;
    if (w.life <= 0) shockwaves.splice(i, 1);
  }
  for (let i = flashes.length - 1; i >= 0; i--) {
    flashes[i].life--;
    if (flashes[i].life <= 0) flashes.splice(i, 1);
  }
  for (let i = damageTexts.length - 1; i >= 0; i--) {
    const dt = damageTexts[i];
    dt.y -= 0.8; dt.life -= 0.018;
    if (dt.life <= 0) damageTexts.splice(i, 1);
  }
  for (let i = confetti.length - 1; i >= 0; i--) {
    const c = confetti[i];
    c.y += c.vy; c.x += c.vx; c.spin += 0.1;
    if (c.y > H + 10) confetti.splice(i, 1);
  }
  shake *= 0.82;
  if (shake < 0.3) shake = 0;
  screenFlash *= 0.86;
  if (screenFlash < 0.01) screenFlash = 0;
}

// ---------- 그리기 ----------
function draw() {
  if (phase === 'menu') { drawMenu(); return; }

  ctx.save();
  if (shake > 0) ctx.translate((Math.random() * 2 - 1) * shake, (Math.random() * 2 - 1) * shake);

  // 하늘
  const sky = ctx.createLinearGradient(0, 0, 0, GROUND_H);
  sky.addColorStop(0, map.sky[0]);
  sky.addColorStop(1, map.sky[1]);
  ctx.fillStyle = sky;
  ctx.fillRect(-20, -20, W + 40, GROUND_H + 40);

  drawDeco();
  drawWindStreaks();

  // 지형
  ctx.fillStyle = map.dirt;
  ctx.beginPath();
  ctx.moveTo(0, GROUND_H);
  for (let x = 0; x < W; x++) ctx.lineTo(x, terrain[x]);
  ctx.lineTo(W, GROUND_H);
  ctx.closePath();
  ctx.fill();

  ctx.strokeStyle = map.top;
  ctx.lineWidth = 3;
  ctx.beginPath();
  ctx.moveTo(0, terrain[0]);
  for (let x = 1; x < W; x++) ctx.lineTo(x, terrain[x]);
  ctx.stroke();

  // 직전 착탄 ✕
  if (lastPlayerHit && phase !== 'gameover') {
    ctx.strokeStyle = 'rgba(255, 230, 120, 0.75)';
    ctx.lineWidth = 2;
    const m = lastPlayerHit, s = 6;
    ctx.beginPath();
    ctx.moveTo(m.x - s, m.y - s); ctx.lineTo(m.x + s, m.y + s);
    ctx.moveTo(m.x + s, m.y - s); ctx.lineTo(m.x - s, m.y + s);
    ctx.stroke();
  }

  drawTank(player);
  drawTank(enemy);

  // 발사 불꽃 — 밝은 심지 + 바깥 후광 두 겹
  for (const f of flashes) {
    const maxLife = f.maxLife ?? 7;
    const t = f.life / maxLife;
    const sc = f.size ?? 1;
    const r = (5 + (maxLife - f.life) * 2.2) * sc;
    ctx.globalAlpha = t * 0.55;
    ctx.fillStyle = f.color;
    ctx.beginPath(); ctx.arc(f.x, f.y, r, 0, Math.PI * 2); ctx.fill();
    ctx.globalAlpha = t;
    ctx.fillStyle = '#fff';
    ctx.beginPath(); ctx.arc(f.x, f.y, r * 0.42, 0, Math.PI * 2); ctx.fill();
    ctx.globalAlpha = 1;
  }

  // 포탄이 지나간 자리의 연기 (포탄보다 먼저 그려야 뒤에 깔립니다)
  for (const s of smoke) {
    ctx.globalAlpha = s.life * 0.4;
    ctx.fillStyle = `rgb(${s.color})`;
    ctx.beginPath(); ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2); ctx.fill();
  }
  ctx.globalAlpha = 1;

  // --- 포탄 ---
  for (const b of bullets) {
    const isOrb = b.shotType === 'orb';
    const s = b.size;

    // 1) 꼬리 — 점이 아니라 굵기가 변하는 띠로 그립니다
    for (let i = 1; i < b.trail.length; i++) {
      const t0 = b.trail[i - 1], t1 = b.trail[i];
      const f = i / b.trail.length;              // 0=오래됨, 1=최신
      ctx.globalAlpha = f * f * 0.75;
      ctx.strokeStyle = b.color;
      ctx.lineWidth = f * s * 1.5;
      ctx.lineCap = 'round';
      ctx.beginPath();
      ctx.moveTo(t0.x, t0.y); ctx.lineTo(t1.x, t1.y);
      ctx.stroke();
    }
    // 꼬리 안쪽의 밝은 심지
    for (let i = 1; i < b.trail.length; i++) {
      const t0 = b.trail[i - 1], t1 = b.trail[i];
      const f = i / b.trail.length;
      ctx.globalAlpha = f * f * f * 0.9;
      ctx.strokeStyle = '#fff';
      ctx.lineWidth = f * s * 0.5;
      ctx.beginPath();
      ctx.moveTo(t0.x, t0.y); ctx.lineTo(t1.x, t1.y);
      ctx.stroke();
    }
    ctx.globalAlpha = 1;
    ctx.lineCap = 'butt';

    // 2) 후광 — 포탄 주위가 빛납니다 (숨쉬듯 크기가 미세하게 변함)
    const pulse = 1 + Math.sin(b.age * 0.28) * 0.12;
    const glowR = s * (isOrb ? 3.4 : 2.3) * pulse;
    const g = ctx.createRadialGradient(b.x, b.y, 0, b.x, b.y, glowR);
    g.addColorStop(0, isOrb ? 'rgba(255,246,201,0.85)' : 'rgba(255,255,255,0.6)');
    g.addColorStop(0.4, isOrb ? 'rgba(255,211,78,0.45)' : 'rgba(255,220,150,0.3)');
    g.addColorStop(1, 'rgba(255,200,100,0)');
    ctx.fillStyle = g;
    ctx.beginPath(); ctx.arc(b.x, b.y, glowR, 0, Math.PI * 2); ctx.fill();

    // 3) 포탄 본체 — 회전하는 네모(마름모)로 그려 굴러가는 느낌을 줍니다
    ctx.save();
    ctx.translate(b.x, b.y);
    ctx.rotate(b.spin);
    ctx.fillStyle = b.color;
    ctx.fillRect(-s, -s, s * 2, s * 2);
    ctx.fillStyle = '#fff';                      // 중심의 흰 심지
    ctx.fillRect(-s * 0.45, -s * 0.45, s * 0.9, s * 0.9);
    ctx.restore();

    // 4) 오브는 회전하는 고리를 두 개 더 두릅니다
    if (isOrb) {
      ctx.strokeStyle = 'rgba(255,246,201,0.8)';
      ctx.lineWidth = 2;
      for (let k = 0; k < 2; k++) {
        const a = b.spin * (k ? -0.7 : 1.1);
        ctx.save();
        ctx.translate(b.x, b.y); ctx.rotate(a);
        ctx.beginPath();
        ctx.ellipse(0, 0, s * 2.1, s * 0.75, 0, 0, Math.PI * 2);
        ctx.stroke();
        ctx.restore();
      }
    }
  }
  ctx.globalAlpha = 1;

  // 폭발 — 바깥 후광 / 불덩이 / 흰 심지 3겹으로 그립니다
  for (const ex of explosions) {
    const gr = ctx.createRadialGradient(ex.x, ex.y, 0, ex.x, ex.y, ex.radius * 1.5);
    gr.addColorStop(0, ex.colors[1]);
    gr.addColorStop(0.45, ex.colors[0]);
    gr.addColorStop(1, 'rgba(0,0,0,0)');
    ctx.globalAlpha = ex.life * 0.55;
    ctx.fillStyle = gr;
    ctx.beginPath(); ctx.arc(ex.x, ex.y, ex.radius * 1.5, 0, Math.PI * 2); ctx.fill();

    ctx.fillStyle = ex.colors[0];
    ctx.globalAlpha = ex.life;
    ctx.beginPath(); ctx.arc(ex.x, ex.y, ex.radius, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = ex.colors[1];
    ctx.globalAlpha = ex.life * 0.9;
    ctx.beginPath(); ctx.arc(ex.x, ex.y, ex.radius * 0.55, 0, Math.PI * 2); ctx.fill();
    // 터진 직후에만 보이는 흰 심지
    if (ex.life > 0.65) {
      ctx.fillStyle = '#fff';
      ctx.globalAlpha = (ex.life - 0.65) * 2.8;
      ctx.beginPath(); ctx.arc(ex.x, ex.y, ex.radius * 0.3, 0, Math.PI * 2); ctx.fill();
    }
    ctx.globalAlpha = 1;
  }
  // 충격파 고리 (스톰·오브) — 폭발 뒤로 먼지가 퍼져나갑니다
  for (const w of shockwaves) {
    ctx.strokeStyle = w.color + (w.life * 0.5).toFixed(2) + ')';
    ctx.lineWidth = 2 + w.life * 3;
    ctx.beginPath(); ctx.arc(w.x, w.y, w.r, 0, Math.PI * 2); ctx.stroke();
  }

  // 파편 (기종마다 크기가 다릅니다)
  for (const p of sparks) {
    ctx.globalAlpha = Math.max(0, p.life);
    ctx.fillStyle = p.color;
    const sz = p.size ?? 3;
    ctx.fillRect(Math.round(p.x) - sz / 2, Math.round(p.y) - sz / 2, sz, sz);
    ctx.globalAlpha = 1;
  }

  // 데미지 숫자
  ctx.textAlign = 'center';
  for (const dt of damageTexts) {
    ctx.fillStyle = `rgba(255, 80, 80, ${dt.life})`;
    ctx.font = 'bold 20px "Courier New", monospace';
    ctx.fillText(`-${dt.value}`, dt.x, dt.y);
    if (dt.self) {          // 자기 포탄에 자기가 맞았을 때
      ctx.fillStyle = `rgba(255, 190, 90, ${dt.life})`;
      ctx.font = 'bold 12px "Courier New", monospace';
      ctx.fillText('자폭!', dt.x, dt.y - 20);
    }
  }
  ctx.textAlign = 'left';

  // 턴 제한 시간 (내 차례에만 화면 위쪽 가운데)
  if (phase === 'aiming' && turn === 'player') {
    const sec = Math.max(0, Math.ceil(turnTimer / 120));
    const urgent = sec <= 5;
    ctx.textAlign = 'center';
    ctx.fillStyle = 'rgba(0,0,0,0.45)';
    ctx.fillRect(W / 2 - 34, 12, 68, 34);
    ctx.fillStyle = urgent ? '#ff5c5c' : '#e8f0fa';
    // 촉박하면 숫자가 커졌다 작아졌다 하며 깜빡입니다
    ctx.font = `bold ${urgent ? 28 + Math.sin(turnTimer * 0.25) * 3 : 24}px "Courier New", monospace`;
    ctx.fillText(String(sec), W / 2, 39);
    ctx.textAlign = 'left';
  }

  // 중앙 안내
  if (messageTimer > 0 && phase !== 'gameover') {
    ctx.textAlign = 'center';
    ctx.fillStyle = turn === 'player' ? player.stats.color : '#f56b6b';
    ctx.font = 'bold 28px "Courier New", monospace';
    ctx.fillText(message, W / 2, 90);
    ctx.textAlign = 'left';
  }
  if (phase === 'aiThink') {
    ctx.textAlign = 'center';
    ctx.fillStyle = 'rgba(245, 107, 107, 0.9)';
    ctx.font = 'bold 14px "Courier New", monospace';
    ctx.fillText(enemy.moveTarget !== null ? '적이 이동하는 중...' : '적이 조준하는 중...', W / 2, 120);
    ctx.textAlign = 'left';
  }

  // 오브 착탄 시 화면 전체 번쩍임
  if (screenFlash > 0) {
    ctx.globalAlpha = screenFlash;
    ctx.fillStyle = '#fff6c9';
    ctx.fillRect(-20, -20, W + 40, GROUND_H + 40);
    ctx.globalAlpha = 1;
  }

  drawHUD();

  if (phase === 'gameover') drawGameOver();

  ctx.restore();
}

// 맵별 배경 장식
function drawDeco() {
  if (map.deco === 'clouds') {
    // 도트풍 구름 (네모 덩어리)
    for (const c of clouds) {
      ctx.fillStyle = 'rgba(255,255,255,0.9)';
      const s = c.s;
      ctx.fillRect(c.x - 30 * s, c.y, 60 * s, 14 * s);
      ctx.fillRect(c.x - 18 * s, c.y - 10 * s, 36 * s, 12 * s);
      ctx.fillRect(c.x - 6 * s,  c.y - 16 * s, 18 * s, 8 * s);
    }
  } else if (map.deco === 'stars') {
    for (const st of stars) {
      ctx.fillStyle = `rgba(255,255,230,${st.b})`;
      ctx.fillRect(st.x, st.y, 2, 2);
    }
    // 달
    ctx.fillStyle = '#f0ead0';
    ctx.beginPath(); ctx.arc(W - 130, 80, 26, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = map.sky[0];
    ctx.beginPath(); ctx.arc(W - 120, 72, 22, 0, Math.PI * 2); ctx.fill();
  } else if (map.deco === 'snow') {
    ctx.fillStyle = 'rgba(255,255,255,0.85)';
    for (const f of snowflakes) ctx.fillRect(f.x, f.y, 2, 2);
  }
}

// 바람 줄기 — 세기가 강할수록 길고 진하게
function drawWindStreaks() {
  if (windLevel === 0) return;
  const len = Math.abs(windLevel) * 7 + 5;
  ctx.strokeStyle = map.streak;
  ctx.lineWidth = 1;
  ctx.beginPath();
  for (const s of windStreaks) {
    ctx.moveTo(s.x, s.y);
    ctx.lineTo(s.x - Math.sign(windLevel) * len, s.y);
  }
  ctx.stroke();
}

// 색을 어둡게/밝게 만드는 도우미 (음영을 넣어 입체감을 줍니다)
function shade(hex, amount) {
  const n = parseInt(hex.slice(1), 16);
  const cl = (v) => Math.max(0, Math.min(255, Math.round(v)));
  const r = cl(((n >> 16) & 255) * amount);
  const g = cl(((n >> 8) & 255) * amount);
  const b = cl((n & 255) * amount);
  return `rgb(${r},${g},${b})`;
}

// 굴러가는 바퀴 하나. spin에 따라 바큇살이 돌아 "구르는 게" 눈에 보입니다.
function drawWheel(cx, cy, r, spin, color) {
  ctx.fillStyle = '#22222e';
  ctx.beginPath(); ctx.arc(cx, cy, r, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = color;
  ctx.beginPath(); ctx.arc(cx, cy, r * 0.42, 0, Math.PI * 2); ctx.fill();
  // 바큇살 2개 (십자 모양이 돌아갑니다)
  ctx.strokeStyle = 'rgba(255,255,255,0.45)';
  ctx.lineWidth = 1.4;
  ctx.beginPath();
  for (let i = 0; i < 2; i++) {
    const a = spin + i * Math.PI / 2;
    ctx.moveTo(cx - Math.cos(a) * r * 0.8, cy - Math.sin(a) * r * 0.8);
    ctx.lineTo(cx + Math.cos(a) * r * 0.8, cy + Math.sin(a) * r * 0.8);
  }
  ctx.stroke();
}

// 탱크 (기종마다 실루엣과 움직임이 다릅니다)
function drawTank(p) {
  const dead = p.hp <= 0;
  const type = TANKS.indexOf(p.stats);
  const c = dead ? '#555' : p.stats.color;
  const dark = dead ? '#3a3a3a' : shade(p.stats.color, 0.62);
  const light = dead ? '#6a6a6a' : shade(p.stats.color, 1.25);
  const hurt = p.hp / CONFIG.maxHp;         // 체력 비율 (낮으면 연기가 납니다)

  ctx.save();
  // 몸체를 땅 기울기에 맞춰 기울이고, 덜컹거림만큼 위아래로 흔듭니다
  ctx.translate(p.x, p.y + p.bob);
  ctx.rotate(p.tilt);

  // --- 포신 (반동으로 뒤로 밀렸다 돌아옵니다) ---
  // 포신 각도는 플레이어가 정한 값이므로 몸체 기울기를 상쇄해 화면 기준으로 유지합니다
  if (!dead) {
    const rad = p.drawAngle * Math.PI / 180;
    ctx.save();
    ctx.rotate(-p.tilt);                    // 기울기 취소 → 포신은 화면 기준
    const pivotY = -14;
    const back = p.recoil;                  // 반동으로 밀린 거리
    const bx = -Math.cos(rad) * back;
    const by = Math.sin(rad) * back;

    const barrelLen = type === 1 ? 28 : type === 2 ? 24 : 26;
    const barrelW   = type === 1 ? 8  : type === 2 ? 4  : 6;

    // 포신 본체
    ctx.strokeStyle = dark;
    ctx.lineWidth = barrelW + 2;
    ctx.beginPath();
    ctx.moveTo(bx, pivotY + by);
    ctx.lineTo(bx + Math.cos(rad) * barrelLen, pivotY + by - Math.sin(rad) * barrelLen);
    ctx.stroke();
    ctx.strokeStyle = '#cfd8dc';
    ctx.lineWidth = barrelW;
    ctx.beginPath();
    ctx.moveTo(bx, pivotY + by);
    ctx.lineTo(bx + Math.cos(rad) * barrelLen, pivotY + by - Math.sin(rad) * barrelLen);
    ctx.stroke();

    // 포구(총구) — 매머드는 굵은 제동기, 스톰은 얇고 긺
    ctx.fillStyle = dark;
    const mx = bx + Math.cos(rad) * barrelLen;
    const my = pivotY + by - Math.sin(rad) * barrelLen;
    ctx.save();
    ctx.translate(mx, my);
    ctx.rotate(-rad);
    if (type === 1) ctx.fillRect(-4, -6, 8, 12);
    else if (type === 2) ctx.fillRect(-2, -3, 5, 6);
    else ctx.fillRect(-3, -4.5, 6, 9);
    ctx.restore();
    ctx.restore();
  }

  // --- 기종별 몸체 ---
  if (type === 1) {
    // 매머드 — 크고 각진 중장갑. 궤도(무한궤도)와 두꺼운 장갑판.
    ctx.fillStyle = dark;
    ctx.fillRect(-20, -9, 40, 9);                 // 하부 차체
    ctx.fillStyle = c;
    ctx.beginPath();                               // 경사 장갑 (사다리꼴)
    ctx.moveTo(-19, -10); ctx.lineTo(19, -10);
    ctx.lineTo(15, -20);  ctx.lineTo(-15, -20);
    ctx.closePath(); ctx.fill();
    ctx.fillStyle = light;
    ctx.fillRect(-15, -20, 30, 3);                 // 윗면 하이라이트
    if (!dead) {
      ctx.fillStyle = c;
      ctx.fillRect(-9, -26, 18, 7);                // 포탑
      ctx.fillStyle = dark;
      ctx.fillRect(-9, -26, 18, 2);
    }
  } else if (type === 2) {
    // 스톰 — 날렵한 저차체 + 레이더 접시 + 안테나
    ctx.fillStyle = dark;
    ctx.fillRect(-15, -8, 30, 8);
    ctx.fillStyle = c;
    ctx.beginPath();                               // 앞이 뾰족한 유선형
    ctx.moveTo(-15, -9); ctx.lineTo(13, -9);
    ctx.lineTo(16, -14); ctx.lineTo(-11, -16);
    ctx.closePath(); ctx.fill();
    if (!dead) {
      ctx.fillStyle = c;
      ctx.beginPath(); ctx.arc(0, -16, 6, Math.PI, 0); ctx.fill();
      ctx.fillStyle = light;
      ctx.beginPath(); ctx.arc(0, -16, 3, Math.PI, 0); ctx.fill();
      // 레이더 접시가 천천히 돕니다
      ctx.strokeStyle = light;
      ctx.lineWidth = 1.6;
      const spin2 = Math.sin(Date.now() / 400) * 0.8;
      ctx.save();
      ctx.translate(9, -20); ctx.rotate(spin2);
      ctx.beginPath(); ctx.arc(0, 0, 4.5, -Math.PI * 0.85, -Math.PI * 0.15); ctx.stroke();
      ctx.restore();
      ctx.fillStyle = dark;
      ctx.fillRect(8.2, -20, 1.6, 6);              // 안테나 기둥
    }
  } else {
    // 레이븐 — 정직한 표준형. 둥근 포탑 + 측면 장갑.
    ctx.fillStyle = dark;
    ctx.fillRect(-17, -9, 34, 9);
    ctx.fillStyle = c;
    ctx.fillRect(-16, -16, 32, 8);
    ctx.fillStyle = light;
    ctx.fillRect(-16, -16, 32, 2);
    if (!dead) {
      ctx.fillStyle = c;
      ctx.beginPath(); ctx.arc(0, -16, 8.5, Math.PI, 0); ctx.fill();
      ctx.fillStyle = light;
      ctx.beginPath(); ctx.arc(-2, -17, 3.5, Math.PI, 0); ctx.fill();
    }
  }

  // --- 바퀴 (기종마다 개수·크기가 다르고, 이동하면 굴러갑니다) ---
  const wheels = type === 1 ? [-14, -5, 5, 14]      // 매머드: 4개 (중장갑)
               : type === 2 ? [-10, 2, 11]          // 스톰: 3개 (경량)
               : [-12, 0, 12];                      // 레이븐: 3개
  const wr = type === 1 ? 5 : type === 2 ? 3.6 : 4.4;
  for (const wx of wheels) drawWheel(wx, -wr + 1, wr, p.wheelSpin, dark);

  // 매머드는 무한궤도 띠를 하나 더 두릅니다
  if (type === 1) {
    ctx.strokeStyle = dead ? '#3a3a3a' : '#3d3d4d';
    ctx.lineWidth = 2;
    ctx.strokeRect(-19, -9, 38, 10);
  }

  ctx.restore();

  // --- 피해 상태: 체력이 낮으면 연기가 피어오릅니다 ---
  if (!dead && hurt < 0.45) {
    const puffs = hurt < 0.2 ? 3 : 2;
    for (let i = 0; i < puffs; i++) {
      const t = (Date.now() / 520 + i * 0.45) % 1;
      ctx.globalAlpha = (1 - t) * (hurt < 0.2 ? 0.5 : 0.32);
      ctx.fillStyle = hurt < 0.2 ? '#5a5a64' : '#7a7a86';
      ctx.beginPath();
      ctx.arc(p.x + 6 + Math.sin(t * 5 + i) * 4, p.y - 26 - t * 26, 3 + t * 5, 0, Math.PI * 2);
      ctx.fill();
    }
    ctx.globalAlpha = 1;
  }

  // 현재 차례 화살표
  const myTurn = (turn === 'player' && p === player) || (turn === 'enemy' && p === enemy);
  if (myTurn && phase !== 'gameover' && !dead) {
    ctx.fillStyle = c;
    const fy = Math.sin(Date.now() / 300) * 3;    // 위아래로 살랑
    ctx.beginPath();
    ctx.moveTo(p.x, p.y - 44 + fy);
    ctx.lineTo(p.x - 7, p.y - 56 + fy);
    ctx.lineTo(p.x + 7, p.y - 56 + fy);
    ctx.closePath();
    ctx.fill();
  }
}

// ---------- 하단 HUD ----------
function drawHUD() {
  // 패널 바탕
  ctx.fillStyle = '#0e1219';
  ctx.fillRect(-20, HUD_Y, W + 40, H - HUD_Y + 20);
  ctx.fillStyle = '#2e3d55';
  ctx.fillRect(-20, HUD_Y, W + 40, 2);

  ctx.textAlign = 'left';

  // === 내 정보 (왼쪽) ===
  ctx.fillStyle = player.stats.color;
  ctx.font = 'bold 13px "Courier New", monospace';
  ctx.fillText(`나 · ${player.stats.name}`, 14, HUD_Y + 20);
  bar(14, HUD_Y + 28, 150, 12, player.hp / CONFIG.maxHp, hpColor(player.hp), player.stats.color);
  ctx.fillStyle = '#8fa3b8';
  ctx.font = '10px "Courier New", monospace';
  ctx.fillText('연료', 14, HUD_Y + 54);
  bar(46, HUD_Y + 46, 118, 7, player.fuel / CONFIG.fuelMax, '#e8c14a', '#555');
  // 오브 게이지 — 가득 차면 금빛으로 반짝입니다
  const gFull = player.gauge >= CONFIG.gaugeMax;
  ctx.fillStyle = gFull ? '#ffd700' : '#8fa3b8';
  ctx.fillText('오브', 14, HUD_Y + 68);
  bar(46, HUD_Y + 60, 118, 7, player.gauge / CONFIG.gaugeMax,
      gFull ? (Math.floor(Date.now() / 250) % 2 ? '#ffd700' : '#fff3b0') : '#7b5cff', '#555');

  // === 각도 + 지난 발사 (중앙 왼쪽) ===
  ctx.fillStyle = '#8fa3b8';
  ctx.font = '11px "Courier New", monospace';
  ctx.fillText('각도', 200, HUD_Y + 18);
  ctx.fillStyle = '#fff';
  ctx.font = 'bold 26px "Courier New", monospace';
  ctx.fillText(`${Math.round(player.angle)}°`, 200, HUD_Y + 44);
  ctx.font = '9px "Courier New", monospace';
  if (showHint && myLastShot) {
    ctx.fillStyle = '#c9b46a';
    ctx.fillText(`지난 ${myLastShot.angle}° ${myLastShot.power}%`, 200, HUD_Y + 68);
  } else if (showHint) {
    ctx.fillStyle = '#556377';
    ctx.fillText('아직 발사 전', 200, HUD_Y + 68);
  } else {
    ctx.fillStyle = '#556377';
    ctx.fillText('힌트 꺼짐 (H)', 200, HUD_Y + 68);
  }

  // === 발사 종류 선택 (1 / 2 / 오브) ===
  const shotList = [
    { id: 'single', label: '1', key: 'Digit1' },
    { id: 'double', label: '2', key: 'Digit2' },
    { id: 'orb',    label: 'S', key: 'KeyS'   },
  ];
  ctx.fillStyle = '#8fa3b8';
  ctx.font = '11px "Courier New", monospace';
  ctx.fillText('발사', 276, HUD_Y + 18);
  for (let i = 0; i < shotList.length; i++) {
    const s = shotList[i];
    const bx = 276 + i * 30, by = HUD_Y + 26;
    const on = selShot === s.id;
    const locked = s.id === 'orb' && player.gauge < CONFIG.gaugeMax;
    ctx.fillStyle = on ? 'rgba(255,215,0,0.22)' : 'rgba(255,255,255,0.05)';
    ctx.fillRect(bx, by, 26, 24);
    ctx.strokeStyle = on ? '#ffd700' : locked ? '#3a4a63' : '#5d7089';
    ctx.lineWidth = on ? 2 : 1;
    ctx.strokeRect(bx + 0.5, by + 0.5, 25, 23);
    ctx.textAlign = 'center';
    ctx.fillStyle = locked ? '#4a5568' : on ? '#ffd700' : '#a8b8cc';
    ctx.font = 'bold 13px "Courier New", monospace';
    ctx.fillText(s.label, bx + 13, by + 17);
    ctx.textAlign = 'left';
  }

  // === 파워 게이지 (중앙) ===
  const PW_X = 372, PW_W = 200;   // 발사 종류 칸(276~354) 오른쪽에 놓습니다
  ctx.fillStyle = '#8fa3b8';
  ctx.font = '11px "Courier New", monospace';
  ctx.fillText('파워', PW_X, HUD_Y + 18);
  const showing = charging ? power : 0;
  const ratio = showing / CONFIG.powerMax;
  bar(PW_X, HUD_Y + 26, PW_W, 20, ratio,
      ratio > 0.85 ? '#f44336' : ratio > 0.6 ? '#ffc107' : '#4caf50', '#3a4a63');
  // 눈금 (10% 간격)
  ctx.fillStyle = 'rgba(255,255,255,0.25)';
  for (let i = 1; i < 10; i++) ctx.fillRect(PW_X + i * (PW_W / 10), HUD_Y + 27, 1, 18);
  ctx.fillStyle = '#fff';
  ctx.font = 'bold 13px "Courier New", monospace';
  ctx.fillText(`${Math.round(showing)}%`, PW_X + PW_W + 6, HUD_Y + 41);

  // 지난 발사 파워 위치 표시 (게이지 위 작은 삼각형)
  if (showHint && myLastShot) {
    const hx = PW_X + PW_W * (myLastShot.power / CONFIG.powerMax);
    ctx.fillStyle = '#c9b46a';
    ctx.beginPath();
    ctx.moveTo(hx, HUD_Y + 24);
    ctx.lineTo(hx - 4, HUD_Y + 17);
    ctx.lineTo(hx + 4, HUD_Y + 17);
    ctx.closePath();
    ctx.fill();
  }

  // === 바람 (중앙 오른쪽) ===
  ctx.textAlign = 'center';
  ctx.fillStyle = '#8fa3b8';
  ctx.font = '11px "Courier New", monospace';
  ctx.fillText('바람', 640, HUD_Y + 18);
  ctx.font = 'bold 15px "Courier New", monospace';
  if (windLevel === 0) {
    ctx.fillStyle = '#6d7a8f';
    ctx.fillText('없음', 640, HUD_Y + 40);
  } else {
    const arrows = (windLevel > 0 ? '→' : '←').repeat(Math.abs(windLevel));
    ctx.fillStyle = Math.abs(windLevel) >= 4 ? '#ffab5c' : '#cfe8ff';
    ctx.fillText(arrows, 640, HUD_Y + 40);
    ctx.font = 'bold 12px "Courier New", monospace';
    ctx.fillText(`${Math.abs(windLevel)}`, 640, HUD_Y + 58);
  }
  ctx.textAlign = 'left';

  // === 적 정보 (오른쪽) ===
  ctx.textAlign = 'right';
  ctx.fillStyle = '#f56b6b';
  ctx.font = 'bold 13px "Courier New", monospace';
  ctx.fillText(`적 · ${enemy.stats.name}`, W - 14, HUD_Y + 20);
  ctx.textAlign = 'left';
  bar(W - 164, HUD_Y + 28, 150, 12, enemy.hp / CONFIG.maxHp, hpColor(enemy.hp), '#f56b6b');
  // 적 오브 게이지 — 가득 차면 곧 필살기가 날아온다는 경고입니다
  const eFull = enemy.gauge >= CONFIG.gaugeMax;
  ctx.textAlign = 'right';
  ctx.font = '9px "Courier New", monospace';
  ctx.fillStyle = eFull ? '#ffd700' : '#6d7a8f';
  ctx.fillText(eFull ? '오브 준비됨!' : '오브', W - 168, HUD_Y + 52);
  ctx.textAlign = 'left';
  bar(W - 164, HUD_Y + 45, 150, 7, enemy.gauge / CONFIG.gaugeMax,
      eFull ? (Math.floor(Date.now() / 250) % 2 ? '#ffd700' : '#fff3b0') : '#7b5cff', '#555');

  // === 음소거 표시 (오른쪽 아래) ===
  ctx.textAlign = 'right';
  ctx.font = '10px "Courier New", monospace';
  ctx.fillStyle = muted ? '#6d7a8f' : '#7ec850';
  ctx.fillText(muted ? '🔇 소리꺼짐 (X)' : '🔊 소리켜짐 (X)', W - 14, HUD_Y + 68);
  ctx.textAlign = 'left';
}

function bar(x, y, w, h, ratio, color, border) {
  ctx.fillStyle = 'rgba(0,0,0,0.55)';
  ctx.fillRect(x, y, w, h);
  ctx.fillStyle = color;
  ctx.fillRect(x + 1, y + 1, Math.max(0, (w - 2) * Math.max(0, Math.min(1, ratio))), h - 2);
  ctx.strokeStyle = border;
  ctx.lineWidth = 1;
  ctx.strokeRect(x + 0.5, y + 0.5, w - 1, h - 1);
}

function hpColor(hp) {
  const r = hp / CONFIG.maxHp;
  return r < 0.3 ? '#f44336' : r < 0.6 ? '#ffc107' : '#4caf50';
}

// ---------- 메뉴 화면 ----------
function tankCardRect(i)  { return { x: 60 + i * 240, y: 118, w: 200, h: 116 }; }
// 상대 탱크는 4칸(3기종 + 무작위)이라 조금 좁게
function enemyCardRect(i) { return { x: 60 + i * 173, y: 268, w: 155, h: 54 }; }
function mapCardRect(i)   { return { x: 60 + i * 240, y: 356, w: 200, h: 78 }; }
function startBtnRect()   { return { x: W / 2 - 120, y: 452, w: 240, h: 42 }; }

function drawMenu() {
  // 배경
  const bg = ctx.createLinearGradient(0, 0, 0, H);
  bg.addColorStop(0, '#141821');
  bg.addColorStop(1, '#1e2836');
  ctx.fillStyle = bg;
  ctx.fillRect(0, 0, W, H);

  // 제목
  ctx.textAlign = 'center';
  ctx.fillStyle = '#ffd700';
  ctx.font = 'bold 40px "Courier New", monospace';
  ctx.fillText('F O R T R E S S', W / 2, 56);
  ctx.fillStyle = '#6d7a8f';
  ctx.font = '12px "Courier New", monospace';
  ctx.fillText('탱크와 맵을 고르고 출격하세요', W / 2, 78);

  // --- 내 탱크 선택 ---
  ctx.textAlign = 'left';
  ctx.fillStyle = menuRow === 0 ? '#ffd700' : '#8fa3b8';
  ctx.font = 'bold 14px "Courier New", monospace';
  ctx.fillText(menuRow === 0 ? '▶ 1. 내 탱크' : '  1. 내 탱크', 60, 108);

  for (let i = 0; i < 3; i++) {
    const r = tankCardRect(i);
    const t = TANKS[i];
    const sel = selTank === i;

    ctx.fillStyle = sel ? 'rgba(255,215,0,0.08)' : 'rgba(255,255,255,0.03)';
    ctx.fillRect(r.x, r.y, r.w, r.h);
    ctx.strokeStyle = sel ? '#ffd700' : '#3a4a63';
    ctx.lineWidth = sel ? 3 : 1;
    ctx.strokeRect(r.x, r.y, r.w, r.h);

    // 미니 탱크 그림
    drawMiniTank(i, r.x + r.w / 2, r.y + 46, t.color, 1.15);

    ctx.textAlign = 'center';
    ctx.fillStyle = t.color;
    ctx.font = 'bold 15px "Courier New", monospace';
    ctx.fillText(t.name, r.x + r.w / 2, r.y + 76);
    ctx.fillStyle = '#8fa3b8';
    ctx.font = '10px "Courier New", monospace';
    ctx.fillText(t.desc.split(' — ')[1], r.x + r.w / 2, r.y + 92);
    ctx.fillStyle = '#c9b46a';
    ctx.fillText(`한방 ${t.dmg} · 폭발범위 ${t.radius}`, r.x + r.w / 2, r.y + 107);
    ctx.textAlign = 'left';
  }

  // --- 상대 탱크 선택 (무작위 포함 4칸) ---
  ctx.fillStyle = menuRow === 1 ? '#ffd700' : '#8fa3b8';
  ctx.font = 'bold 14px "Courier New", monospace';
  ctx.fillText(menuRow === 1 ? '▶ 2. 상대 탱크' : '  2. 상대 탱크', 60, 258);

  for (let i = 0; i < 4; i++) {
    const r = enemyCardRect(i);
    const sel = selEnemy === i;
    const isRandom = i === 3;
    const t = isRandom ? null : TANKS[i];

    ctx.fillStyle = sel ? 'rgba(245,107,107,0.10)' : 'rgba(255,255,255,0.03)';
    ctx.fillRect(r.x, r.y, r.w, r.h);
    ctx.strokeStyle = sel ? '#f56b6b' : '#3a4a63';
    ctx.lineWidth = sel ? 3 : 1;
    ctx.strokeRect(r.x, r.y, r.w, r.h);

    if (isRandom) {
      ctx.textAlign = 'center';
      ctx.fillStyle = sel ? '#f56b6b' : '#8fa3b8';
      ctx.font = 'bold 20px "Courier New", monospace';
      ctx.fillText('?', r.x + 30, r.y + 36);
      ctx.font = 'bold 13px "Courier New", monospace';
      ctx.fillText('무작위', r.x + 100, r.y + 27);
      ctx.fillStyle = '#6d7a8f';
      ctx.font = '9px "Courier New", monospace';
      ctx.fillText('붙어봐야 앎', r.x + 100, r.y + 42);
    } else {
      drawMiniTank(i, r.x + 32, r.y + 30, t.color, 0.62);
      ctx.textAlign = 'center';
      ctx.fillStyle = t.color;
      ctx.font = 'bold 13px "Courier New", monospace';
      ctx.fillText(t.name, r.x + 100, r.y + 27);
      ctx.fillStyle = '#8fa3b8';
      ctx.font = '9px "Courier New", monospace';
      ctx.fillText(`한방 ${t.dmg} · 범위 ${t.radius}`, r.x + 100, r.y + 42);
    }
    ctx.textAlign = 'left';
  }

  // --- 맵 선택 ---
  ctx.fillStyle = menuRow === 2 ? '#ffd700' : '#8fa3b8';
  ctx.font = 'bold 14px "Courier New", monospace';
  ctx.fillText(menuRow === 2 ? '▶ 3. 맵 선택' : '  3. 맵 선택', 60, 346);

  for (let i = 0; i < 3; i++) {
    const r = mapCardRect(i);
    const m = MAPS[i];
    const sel = selMap === i;

    // 하늘 미리보기
    const g = ctx.createLinearGradient(0, r.y, 0, r.y + r.h);
    g.addColorStop(0, m.sky[0]);
    g.addColorStop(1, m.sky[1]);
    ctx.fillStyle = g;
    ctx.fillRect(r.x, r.y, r.w, r.h);
    // 지형 미리보기 (아랫부분 물결)
    ctx.fillStyle = m.dirt;
    ctx.beginPath();
    ctx.moveTo(r.x, r.y + r.h);
    for (let px = 0; px <= r.w; px += 4) {
      ctx.lineTo(r.x + px, r.y + r.h - 16 - Math.sin(px * 0.05 + i * 2) * 7);
    }
    ctx.lineTo(r.x + r.w, r.y + r.h);
    ctx.closePath();
    ctx.fill();

    ctx.strokeStyle = sel ? '#ffd700' : '#3a4a63';
    ctx.lineWidth = sel ? 3 : 1;
    ctx.strokeRect(r.x, r.y, r.w, r.h);

    ctx.textAlign = 'center';
    ctx.fillStyle = '#fff';
    ctx.font = 'bold 14px "Courier New", monospace';
    ctx.fillText(m.name, r.x + r.w / 2, r.y + r.h - 8);
    ctx.textAlign = 'left';
  }

  // --- 시작 버튼 ---
  const b = startBtnRect();
  const blink = Math.floor(Date.now() / 400) % 2 === 0;
  ctx.fillStyle = blink ? 'rgba(255,215,0,0.15)' : 'rgba(255,215,0,0.07)';
  ctx.fillRect(b.x, b.y, b.w, b.h);
  ctx.strokeStyle = '#ffd700';
  ctx.lineWidth = 2;
  ctx.strokeRect(b.x, b.y, b.w, b.h);
  ctx.textAlign = 'center';
  ctx.fillStyle = '#ffd700';
  ctx.font = 'bold 18px "Courier New", monospace';
  ctx.fillText('출  격 !', W / 2, b.y + 28);

  ctx.fillStyle = '#556377';
  ctx.font = '11px "Courier New", monospace';
  ctx.fillText('↑↓ 줄 이동 · ←→ 선택 · Enter 시작  (마우스 클릭도 됩니다)', W / 2, 516);
  ctx.textAlign = 'left';
}

// 메뉴 카드용 미니 탱크.
// 실제 게임의 drawTank와 같은 모양을 그려서, 고른 것과 나오는 게 일치하게 합니다.
function drawMiniTank(type, cx, cy, color, scale = 1) {
  const dark = shade(color, 0.62);
  const light = shade(color, 1.25);
  ctx.save();
  ctx.translate(cx, cy + 8 * scale);
  ctx.scale(scale, scale);

  // 포신
  const rad = 32 * Math.PI / 180;
  const bl = type === 1 ? 28 : type === 2 ? 24 : 26;
  const bw = type === 1 ? 8 : type === 2 ? 4 : 6;
  ctx.strokeStyle = dark; ctx.lineWidth = bw + 2;
  ctx.beginPath(); ctx.moveTo(0, -14);
  ctx.lineTo(Math.cos(rad) * bl, -14 - Math.sin(rad) * bl); ctx.stroke();
  ctx.strokeStyle = '#cfd8dc'; ctx.lineWidth = bw;
  ctx.beginPath(); ctx.moveTo(0, -14);
  ctx.lineTo(Math.cos(rad) * bl, -14 - Math.sin(rad) * bl); ctx.stroke();

  if (type === 1) {
    ctx.fillStyle = dark; ctx.fillRect(-20, -9, 40, 9);
    ctx.fillStyle = color;
    ctx.beginPath();
    ctx.moveTo(-19, -10); ctx.lineTo(19, -10);
    ctx.lineTo(15, -20); ctx.lineTo(-15, -20);
    ctx.closePath(); ctx.fill();
    ctx.fillStyle = light; ctx.fillRect(-15, -20, 30, 3);
    ctx.fillStyle = color; ctx.fillRect(-9, -26, 18, 7);
  } else if (type === 2) {
    ctx.fillStyle = dark; ctx.fillRect(-15, -8, 30, 8);
    ctx.fillStyle = color;
    ctx.beginPath();
    ctx.moveTo(-15, -9); ctx.lineTo(13, -9);
    ctx.lineTo(16, -14); ctx.lineTo(-11, -16);
    ctx.closePath(); ctx.fill();
    ctx.beginPath(); ctx.arc(0, -16, 6, Math.PI, 0); ctx.fill();
    ctx.strokeStyle = light; ctx.lineWidth = 1.6;
    ctx.beginPath(); ctx.arc(9, -20, 4.5, -Math.PI * 0.85, -Math.PI * 0.15); ctx.stroke();
    ctx.fillStyle = dark; ctx.fillRect(8.2, -20, 1.6, 6);
  } else {
    ctx.fillStyle = dark; ctx.fillRect(-17, -9, 34, 9);
    ctx.fillStyle = color; ctx.fillRect(-16, -16, 32, 8);
    ctx.fillStyle = light; ctx.fillRect(-16, -16, 32, 2);
    ctx.fillStyle = color;
    ctx.beginPath(); ctx.arc(0, -16, 8.5, Math.PI, 0); ctx.fill();
  }

  const wheels = type === 1 ? [-14, -5, 5, 14] : type === 2 ? [-10, 2, 11] : [-12, 0, 12];
  const wr = type === 1 ? 5 : type === 2 ? 3.6 : 4.4;
  for (const wx of wheels) drawWheel(wx, -wr + 1, wr, 0, dark);
  ctx.restore();
}

// ---------- 게임 종료 화면 ----------
function drawGameOver() {
  ctx.fillStyle = 'rgba(0, 0, 0, 0.7)';
  ctx.fillRect(-20, -20, W + 40, H + 40);

  // 승리 폭죽
  for (const c of confetti) {
    ctx.save();
    ctx.translate(c.x, c.y);
    ctx.rotate(c.spin);
    ctx.fillStyle = c.color;
    ctx.fillRect(-c.size / 2, -c.size / 2, c.size, c.size);
    ctx.restore();
  }

  ctx.textAlign = 'center';
  if (winner === 'player') {
    ctx.fillStyle = '#ffd700';
    ctx.font = 'bold 46px "Courier New", monospace';
    ctx.fillText('승  리 !', W / 2, H / 2 - 30);
  } else if (winner === 'enemy') {
    ctx.fillStyle = '#f56b6b';
    ctx.font = 'bold 46px "Courier New", monospace';
    ctx.fillText('패  배', W / 2, H / 2 - 30);
  } else {
    ctx.fillStyle = '#ccc';
    ctx.font = 'bold 46px "Courier New", monospace';
    ctx.fillText('무 승 부', W / 2, H / 2 - 30);
  }
  ctx.fillStyle = '#fff';
  ctx.font = 'bold 16px "Courier New", monospace';
  ctx.fillText('R 재대결  ·  M 처음 화면', W / 2, H / 2 + 24);
  ctx.textAlign = 'left';
}

// ---------- 루프 ----------
// 게임 속도를 모니터 주사율과 분리합니다.
// 그냥 매 화면마다 update()를 부르면 120Hz 모니터에서는 2배속,
// 60Hz 모니터에서는 절반 속도가 되어버립니다.
// 시간을 재서 "1초에 정확히 120번"만 게임을 진행시킵니다.
const STEP = 1000 / 120;   // 한 걸음 = 1/120초
let lastTime = 0;
let acc = 0;

function loop(ts) {
  if (!lastTime) lastTime = ts;
  let dt = ts - lastTime;
  lastTime = ts;
  if (dt > 100) dt = 100;   // 탭을 오래 벗어났다 돌아와도 몰아서 진행하지 않게 제한

  acc += dt;
  while (acc >= STEP) {
    update();
    acc -= STEP;
  }
  draw();
  requestAnimationFrame(loop);
}

requestAnimationFrame(loop);
</script>
