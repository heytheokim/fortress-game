}

// 지형 위 풍경 (나무·수풀·벤치 등) — 지형을 그린 뒤에 호출합니다
function drawScenery() {
  for (const o of scenery) drawSceneryItem(o);
}


// 바람 줄기 — 세기가 강할수록 길고 진하게
function drawWindStreaks() {
  if (windLevel === 0) return;
  const len = Math.abs(windLevel) * 7 + 5;
  ctx.strokeStyle = map.streak;
  ctx.lineWidth = 1;
  ctx.beginPath();
  for (const s of windStreaks) {
    ctx.moveTo(s.x, s.y);
    ctx.lineTo(s.x - Math.sign(windLevel) * len, s.y);
  }
  ctx.stroke();
}

// 색을 어둡게/밝게 만드는 도우미 (음영을 넣어 입체감을 줍니다)
function shade(hex, amount) {
  const n = parseInt(hex.slice(1), 16);
  const cl = (v) => Math.max(0, Math.min(255, Math.round(v)));
  const r = cl(((n >> 16) & 255) * amount);
  const g = cl(((n >> 8) & 255) * amount);
  const b = cl((n & 255) * amount);
  return `rgb(${r},${g},${b})`;
}

// 굴러가는 바퀴 하나. spin에 따라 바큇살이 돌아 "구르는 게" 눈에 보입니다.
function drawWheel(cx, cy, r, spin, color) {
  ctx.fillStyle = '#22222e';
  ctx.beginPath(); ctx.arc(cx, cy, r, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = color;
  ctx.beginPath(); ctx.arc(cx, cy, r * 0.42, 0, Math.PI * 2); ctx.fill();
  // 바큇살 2개 (십자 모양이 돌아갑니다)
  ctx.strokeStyle = 'rgba(255,255,255,0.45)';
  ctx.lineWidth = 1.4;
  ctx.beginPath();
  for (let i = 0; i < 2; i++) {
    const a = spin + i * Math.PI / 2;
    ctx.moveTo(cx - Math.cos(a) * r * 0.8, cy - Math.sin(a) * r * 0.8);
    ctx.lineTo(cx + Math.cos(a) * r * 0.8, cy + Math.sin(a) * r * 0.8);
  }
  ctx.stroke();
}

// 탱크 (기종마다 실루엣과 움직임이 다릅니다)
function drawTank(p) {
  const dead = p.hp <= 0;
  const type = TANKS.indexOf(p.stats);
  const c = dead ? '#555' : p.stats.color;
  const hurt = p.hp / CONFIG.maxHp;         // 체력 비율 (낮으면 연기가 납니다)

  ctx.save();
  // 몸체를 땅 기울기에 맞춰 기울이고, 덜컹거림만큼 위아래로 흔듭니다
  ctx.translate(p.x, p.y + p.bob);
  ctx.rotate(p.tilt);
  drawTankBody(p, type, p.stats.color);
  ctx.restore();
  drawTankExtras(p, type, c, hurt, dead);
}

// 탱크 몸통만 그립니다 (원점 = 대포가 땅에 닿는 지점).
// 실제 게임과 메뉴의 미니 탱크가 같은 그림을 쓰도록 분리했습니다.
function drawTankBody(p, type, baseColor) {
  const dead = p.hp <= 0;
  const c = dead ? '#555' : baseColor;
  const dark = dead ? '#3a3a3a' : shade(baseColor, 0.62);
  const light = dead ? '#6a6a6a' : shade(baseColor, 1.25);

  // --- 포신 (반동으로 뒤로 밀렸다 돌아옵니다) ---
  // 포신 각도는 플레이어가 정한 값이므로 몸체 기울기를 상쇄해 화면 기준으로 유지합니다
  if (!dead) {
    const rad = p.drawAngle * Math.PI / 180;
    ctx.save();
    ctx.rotate(-p.tilt);                    // 기울기 취소 → 포신은 화면 기준
    const pivotY = -14;
    const back = p.recoil;                  // 반동으로 밀린 거리
    const bx = -Math.cos(rad) * back;
    const by = Math.sin(rad) * back;

    const BLEN = [26, 28, 24, 34, 22, 24, 27];   // 랜스는 길고, 볼링은 짧습니다
    const BW   = [6, 8, 4, 4, 7, 5, 8];
    const barrelLen = BLEN[type] ?? 26;
    const barrelW   = BW[type] ?? 6;

    // 포신 본체
    ctx.strokeStyle = dark;
    ctx.lineWidth = barrelW + 2;
    ctx.beginPath();
    ctx.moveTo(bx, pivotY + by);
    ctx.lineTo(bx + Math.cos(rad) * barrelLen, pivotY + by - Math.sin(rad) * barrelLen);
    ctx.stroke();
    ctx.strokeStyle = '#cfd8dc';
    ctx.lineWidth = barrelW;
    ctx.beginPath();
    ctx.moveTo(bx, pivotY + by);
    ctx.lineTo(bx + Math.cos(rad) * barrelLen, pivotY + by - Math.sin(rad) * barrelLen);
    ctx.stroke();

    // 포구(총구) — 매머드는 굵은 제동기, 스톰은 얇고 긺
    ctx.fillStyle = dark;
    const mx = bx + Math.cos(rad) * barrelLen;
    const my = pivotY + by - Math.sin(rad) * barrelLen;
    ctx.save();
    ctx.translate(mx, my);
    ctx.rotate(-rad);
    if (type === 1) ctx.fillRect(-4, -6, 8, 12);
    else if (type === 2) ctx.fillRect(-2, -3, 5, 6);
    else ctx.fillRect(-3, -4.5, 6, 9);
    ctx.restore();
    ctx.restore();
  }

  // --- 기종별 몸체 ---
  if (type === 1) {
    // 매머드 — 크고 각진 중장갑. 궤도(무한궤도)와 두꺼운 장갑판.
    ctx.fillStyle = dark;
    ctx.fillRect(-20, -9, 40, 9);                 // 하부 차체
    ctx.fillStyle = c;
    ctx.beginPath();                               // 경사 장갑 (사다리꼴)
    ctx.moveTo(-19, -10); ctx.lineTo(19, -10);
    ctx.lineTo(15, -20);  ctx.lineTo(-15, -20);
    ctx.closePath(); ctx.fill();
    ctx.fillStyle = light;
    ctx.fillRect(-15, -20, 30, 3);                 // 윗면 하이라이트
    if (!dead) {
      ctx.fillStyle = c;
      ctx.fillRect(-9, -26, 18, 7);                // 포탑
      ctx.fillStyle = dark;
      ctx.fillRect(-9, -26, 18, 2);
    }
  } else if (type === 2) {
    // 스톰 — 날렵한 저차체 + 레이더 접시 + 안테나
    ctx.fillStyle = dark;
    ctx.fillRect(-15, -8, 30, 8);
    ctx.fillStyle = c;
    ctx.beginPath();                               // 앞이 뾰족한 유선형
    ctx.moveTo(-15, -9); ctx.lineTo(13, -9);
    ctx.lineTo(16, -14); ctx.lineTo(-11, -16);
    ctx.closePath(); ctx.fill();
    if (!dead) {
      ctx.fillStyle = c;
      ctx.beginPath(); ctx.arc(0, -16, 6, Math.PI, 0); ctx.fill();
      ctx.fillStyle = light;
      ctx.beginPath(); ctx.arc(0, -16, 3, Math.PI, 0); ctx.fill();
      // 레이더 접시가 천천히 돕니다
      ctx.strokeStyle = light;
      ctx.lineWidth = 1.6;
      const spin2 = Math.sin(Date.now() / 400) * 0.8;
      ctx.save();
      ctx.translate(9, -20); ctx.rotate(spin2);
      ctx.beginPath(); ctx.arc(0, 0, 4.5, -Math.PI * 0.85, -Math.PI * 0.15); ctx.stroke();
      ctx.restore();
      ctx.fillStyle = dark;
      ctx.fillRect(8.2, -20, 1.6, 6);              // 안테나 기둥
    }
  } else if (type === 3) {
    // 랜스 — 길고 낮은 저격형 차체 + 안정용 지지대
    ctx.fillStyle = dark;
    ctx.fillRect(-18, -8, 36, 8);
    ctx.fillStyle = c;
    ctx.beginPath();
    ctx.moveTo(-18, -9); ctx.lineTo(16, -9);
    ctx.lineTo(12, -17); ctx.lineTo(-14, -17);
    ctx.closePath(); ctx.fill();
    ctx.fillStyle = light;
    ctx.fillRect(-14, -17, 26, 2);
    if (!dead) {
      ctx.fillStyle = dark;
      ctx.fillRect(-16, -4, 5, 8);        // 뒤쪽 지지대
      ctx.fillStyle = c;
      ctx.fillRect(-6, -22, 12, 6);
    }
  } else if (type === 4) {
    // 볼링 — 둥글넓적한 차체 + 앞쪽 투척 롤러
    ctx.fillStyle = dark;
    ctx.fillRect(-17, -9, 34, 9);
    ctx.fillStyle = c;
    ctx.beginPath(); ctx.arc(0, -10, 15, Math.PI, 0); ctx.fill();
    ctx.fillRect(-15, -11, 30, 3);
    ctx.fillStyle = light;
    ctx.beginPath(); ctx.arc(-3, -11, 6, Math.PI, 0); ctx.fill();
    if (!dead) {
      ctx.fillStyle = dark;
      ctx.beginPath(); ctx.arc(13, -12, 5, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = light;
      ctx.beginPath(); ctx.arc(13, -12, 2, 0, Math.PI * 2); ctx.fill();
    }
  } else if (type === 5) {
    // 스웜 — 다연장 발사대. 위에 발사관이 여러 개 보입니다.
    ctx.fillStyle = dark;
    ctx.fillRect(-16, -9, 32, 9);
    ctx.fillStyle = c;
    ctx.fillRect(-15, -16, 30, 8);
    ctx.fillStyle = light;
    ctx.fillRect(-15, -16, 30, 2);
    if (!dead) {
      ctx.fillStyle = dark;
      for (let i = 0; i < 4; i++) ctx.fillRect(-11 + i * 6, -23, 4, 8);
      ctx.fillStyle = c;
      ctx.fillRect(-13, -25, 26, 3);
    }
  } else if (type === 6) {
    // 드릴 — 육중한 굴착차. 앞에 회전하는 드릴 날.
    ctx.fillStyle = dark;
    ctx.fillRect(-19, -10, 38, 10);
    ctx.fillStyle = c;
    ctx.fillRect(-17, -18, 34, 9);
    ctx.fillStyle = light;
    ctx.fillRect(-17, -18, 34, 2);
    if (!dead) {
      ctx.fillStyle = c;
      ctx.fillRect(-8, -25, 16, 8);
      // 앞쪽 드릴 (천천히 회전)
      ctx.save();
      ctx.translate(17, -12);
      ctx.rotate(Date.now() / 260);
      ctx.fillStyle = light;
      for (let i = 0; i < 3; i++) {
        const a = (i / 3) * Math.PI * 2;
        ctx.fillRect(Math.cos(a) * 3 - 1.5, Math.sin(a) * 3 - 1.5, 3, 3);
      }
      ctx.restore();
      ctx.fillStyle = dark;
      ctx.beginPath();
      ctx.moveTo(13, -18); ctx.lineTo(24, -12); ctx.lineTo(13, -6);
      ctx.closePath(); ctx.fill();
    }
  } else {
    // 레이븐 — 정직한 표준형. 둥근 포탑 + 측면 장갑.
    ctx.fillStyle = dark;
    ctx.fillRect(-17, -9, 34, 9);
    ctx.fillStyle = c;
    ctx.fillRect(-16, -16, 32, 8);
    ctx.fillStyle = light;
    ctx.fillRect(-16, -16, 32, 2);
    if (!dead) {
      ctx.fillStyle = c;
      ctx.beginPath(); ctx.arc(0, -16, 8.5, Math.PI, 0); ctx.fill();
      ctx.fillStyle = light;
      ctx.beginPath(); ctx.arc(-2, -17, 3.5, Math.PI, 0); ctx.fill();
    }
  }

  // --- 바퀴 (기종마다 개수·크기가 다르고, 이동하면 굴러갑니다) ---
  const WHEELS = [
    [-12, 0, 12],              // 0 레이븐
    [-14, -5, 5, 14],          // 1 매머드
    [-10, 2, 11],              // 2 스톰
    [-13, -2, 12],             // 3 랜스
    [-11, 1, 12],              // 4 볼링
    [-12, -1, 11],             // 5 스웜
    [-15, -6, 4, 14],          // 6 드릴
  ];
  const WR = [4.4, 5, 3.6, 4.0, 4.8, 4.2, 5.2];
  const wheels = WHEELS[type] || WHEELS[0];
  const wr = WR[type] ?? 4.4;
  for (const wx of wheels) drawWheel(wx, -wr + 1, wr, p.wheelSpin, dark);

  // 매머드·드릴은 무한궤도 띠를 하나 더 두릅니다
  if (type === 1 || type === 6) {
    ctx.strokeStyle = dead ? '#3a3a3a' : '#3d3d4d';
    ctx.lineWidth = 2;
    ctx.strokeRect(-19, -9, 38, 10);
  }
}

// 하늘에서 떨어지는 보급품 (낙하산 + 상자)
function drawItems() {
  for (const it of items) {
    const d = it.def;
    const bob = it.landed ? Math.sin(Date.now() / 300) * 2 : 0;
    const y = it.y + bob;

    if (!it.landed) {
      // 낙하산 — 반원 + 줄
      ctx.fillStyle = d.color;
      ctx.beginPath();
      ctx.arc(it.x, y - 20, 15, Math.PI, 0);
      ctx.fill();
      ctx.fillStyle = 'rgba(255,255,255,0.35)';
      ctx.beginPath();
      ctx.arc(it.x - 5, y - 20, 6, Math.PI, 0);
      ctx.fill();
      ctx.strokeStyle = 'rgba(255,255,255,0.7)';
      ctx.lineWidth = 1;
      ctx.beginPath();
      ctx.moveTo(it.x - 14, y - 20); ctx.lineTo(it.x - 6, y - 8);
      ctx.moveTo(it.x + 14, y - 20); ctx.lineTo(it.x + 6, y - 8);
      ctx.stroke();
    } else {
      // 땅에 놓이면 반짝이는 후광
      const pulse = 0.5 + Math.sin(Date.now() / 260) * 0.25;
      const g = ctx.createRadialGradient(it.x, y - 2, 0, it.x, y - 2, 26);
      g.addColorStop(0, d.color + 'aa');
      g.addColorStop(1, 'rgba(0,0,0,0)');
      ctx.globalAlpha = pulse;
      ctx.fillStyle = g;
      ctx.beginPath(); ctx.arc(it.x, y - 2, 26, 0, Math.PI * 2); ctx.fill();
      ctx.globalAlpha = 1;
    }

    // 상자
    ctx.fillStyle = shade(d.color, 0.55);
    ctx.fillRect(it.x - 11, y - 9, 22, 18);
    ctx.fillStyle = d.color;
    ctx.fillRect(it.x - 9, y - 7, 18, 14);
    ctx.fillStyle = '#fff';
    ctx.textAlign = 'center';
    ctx.font = 'bold 13px "Courier New", monospace';
    ctx.fillText(d.icon, it.x, y + 5);
    ctx.textAlign = 'left';
  }
}

// 탱크 주변에 그리는 것들 (연기·차례 표시) — 화면 좌표 기준이라 몸통과 분리했습니다
function drawTankExtras(p, type, c, hurt, dead) {
  // --- 피해 상태: 체력이 낮으면 연기가 피어오릅니다 ---
  if (!dead && hurt < 0.45) {
    const puffs = hurt < 0.2 ? 3 : 2;
    for (let i = 0; i < puffs; i++) {
      const t = (Date.now() / 520 + i * 0.45) % 1;
      ctx.globalAlpha = (1 - t) * (hurt < 0.2 ? 0.5 : 0.32);
      ctx.fillStyle = hurt < 0.2 ? '#5a5a64' : '#7a7a86';
      ctx.beginPath();
      ctx.arc(p.x + 6 + Math.sin(t * 5 + i) * 4, p.y - 26 - t * 26, 3 + t * 5, 0, Math.PI * 2);
      ctx.fill();
    }
    ctx.globalAlpha = 1;
  }

  // 현재 차례 화살표
  const myTurn = (turn === 'player' && p === player) || (turn === 'enemy' && p === enemy);
  if (myTurn && phase !== 'gameover' && !dead) {
    ctx.fillStyle = c;
    const fy = Math.sin(Date.now() / 300) * 3;    // 위아래로 살랑
    ctx.beginPath();
    ctx.moveTo(p.x, p.y - 44 + fy);
    ctx.lineTo(p.x - 7, p.y - 56 + fy);
    ctx.lineTo(p.x + 7, p.y - 56 + fy);
    ctx.closePath();
    ctx.fill();
  }
}

// ---------- 하단 HUD ----------
function drawHUD() {
  // 패널 바탕
  ctx.fillStyle = '#0e1219';
  ctx.fillRect(-20, HUD_Y, W + 40, H - HUD_Y + 20);
  ctx.fillStyle = '#2e3d55';
  ctx.fillRect(-20, HUD_Y, W + 40, 2);

  ctx.textAlign = 'left';

  // === 내 정보 (왼쪽) ===
  ctx.fillStyle = player.stats.color;
  ctx.font = 'bold 13px "Courier New", monospace';
  ctx.fillText(`나 · ${player.stats.name}`, 14, HUD_Y + 20);
  bar(14, HUD_Y + 28, 180, 14, player.hp / CONFIG.maxHp, hpColor(player.hp), player.stats.color);
  ctx.fillStyle = '#8fa3b8';
  ctx.font = '10px "Courier New", monospace';
  ctx.fillText('연료', 14, HUD_Y + 58);
  bar(46, HUD_Y + 50, 148, 8, player.fuel / CONFIG.fuelMax, '#e8c14a', '#555');
  // 오브 게이지 — 가득 차면 금빛으로 반짝입니다
  const gFull = player.gauge >= CONFIG.gaugeMax;
  ctx.fillStyle = gFull ? '#ffd700' : '#8fa3b8';
  ctx.fillText('오브', 14, HUD_Y + 74);
  bar(46, HUD_Y + 66, 148, 8, player.gauge / CONFIG.gaugeMax,
      gFull ? (Math.floor(Date.now() / 250) % 2 ? '#ffd700' : '#fff3b0') : '#7b5cff', '#555');

  // === 각도 + 지난 발사 (중앙 왼쪽) ===
  ctx.fillStyle = '#8fa3b8';
  ctx.font = '11px "Courier New", monospace';
  ctx.fillText('각도', 250, HUD_Y + 18);
  ctx.fillStyle = '#fff';
  ctx.font = 'bold 26px "Courier New", monospace';
  ctx.fillText(`${Math.round(player.angle)}°`, 250, HUD_Y + 46);
  ctx.font = '9px "Courier New", monospace';
  if (showHint && myLastShot) {
    ctx.fillStyle = '#c9b46a';
    ctx.fillText(`지난 ${myLastShot.angle}° ${myLastShot.power}%`, 250, HUD_Y + 72);
  } else if (showHint) {
    ctx.fillStyle = '#556377';
    ctx.fillText('아직 발사 전', 250, HUD_Y + 72);
  } else {
    ctx.fillStyle = '#556377';
    ctx.fillText('힌트 꺼짐 (H)', 250, HUD_Y + 72);
  }

  // === 발사 종류 선택 (1 / 2 / 오브) ===
  const shotList = [
    { id: 'single', label: '1', key: 'Digit1' },
    { id: 'double', label: '2', key: 'Digit2' },
    { id: 'orb',    label: 'S', key: 'KeyS'   },
  ];
  ctx.fillStyle = '#8fa3b8';
  ctx.font = '11px "Courier New", monospace';
  ctx.fillText('발사', 340, HUD_Y + 18);
  for (let i = 0; i < shotList.length; i++) {
    const s = shotList[i];
    const bx = 340 + i * 32, by = HUD_Y + 26;
    const on = selShot === s.id;
    const locked = s.id === 'orb' && player.gauge < CONFIG.gaugeMax;
    ctx.fillStyle = on ? 'rgba(255,215,0,0.22)' : 'rgba(255,255,255,0.05)';
    ctx.fillRect(bx, by, 28, 26);
    ctx.strokeStyle = on ? '#ffd700' : locked ? '#3a4a63' : '#5d7089';
    ctx.lineWidth = on ? 2 : 1;
    ctx.strokeRect(bx + 0.5, by + 0.5, 27, 25);
    ctx.textAlign = 'center';
    ctx.fillStyle = locked ? '#4a5568' : on ? '#ffd700' : '#a8b8cc';
    ctx.font = 'bold 13px "Courier New", monospace';
    ctx.fillText(s.label, bx + 14, by + 18);
    ctx.textAlign = 'left';
  }

  // === 파워 게이지 (중앙) ===
  const PW_X = 452, PW_W = 300;   // 발사 종류 칸(340~436) 오른쪽에 놓습니다
  ctx.fillStyle = '#8fa3b8';
  ctx.font = '11px "Courier New", monospace';
  ctx.fillText('파워', PW_X, HUD_Y + 18);
  const showing = charging ? power : 0;
  const ratio = showing / CONFIG.powerMax;
  bar(PW_X, HUD_Y + 26, PW_W, 20, ratio,
      ratio > 0.85 ? '#f44336' : ratio > 0.6 ? '#ffc107' : '#4caf50', '#3a4a63');
  // 눈금 (10% 간격)
  ctx.fillStyle = 'rgba(255,255,255,0.25)';
  for (let i = 1; i < 10; i++) ctx.fillRect(PW_X + i * (PW_W / 10), HUD_Y + 27, 1, 18);
  ctx.fillStyle = '#fff';
  ctx.font = 'bold 13px "Courier New", monospace';
  ctx.fillText(`${Math.round(showing)}%`, PW_X + PW_W + 6, HUD_Y + 41);

  // 지난 발사 파워 위치 표시 (게이지 위 작은 삼각형)
  if (showHint && myLastShot) {
    const hx = PW_X + PW_W * (myLastShot.power / CONFIG.powerMax);
    ctx.fillStyle = '#c9b46a';
    ctx.beginPath();
    ctx.moveTo(hx, HUD_Y + 24);
    ctx.lineTo(hx - 4, HUD_Y + 17);
    ctx.lineTo(hx + 4, HUD_Y + 17);
    ctx.closePath();
    ctx.fill();
  }

  // === 바람 (중앙 오른쪽) ===
  ctx.textAlign = 'center';
  ctx.fillStyle = '#8fa3b8';
  ctx.font = '11px "Courier New", monospace';
  ctx.fillText('바람', 830, HUD_Y + 18);
  ctx.font = 'bold 15px "Courier New", monospace';
  if (windLevel === 0) {
    ctx.fillStyle = '#6d7a8f';
    ctx.fillText('없음', 830, HUD_Y + 42);
  } else {
    const arrows = (windLevel > 0 ? '→' : '←').repeat(Math.abs(windLevel));
    ctx.fillStyle = Math.abs(windLevel) >= 4 ? '#ffab5c' : '#cfe8ff';
    ctx.fillText(arrows, 830, HUD_Y + 42);
    ctx.font = 'bold 12px "Courier New", monospace';
    ctx.fillText(`${Math.abs(windLevel)}`, 830, HUD_Y + 62);
  }
  ctx.textAlign = 'left';

  // === 적 정보 (오른쪽) ===
  ctx.textAlign = 'right';
  ctx.fillStyle = '#f56b6b';
  ctx.font = 'bold 13px "Courier New", monospace';
  ctx.fillText(`적 · ${enemy.stats.name}`, W - 14, HUD_Y + 20);
  ctx.textAlign = 'left';
  bar(W - 194, HUD_Y + 28, 180, 14, enemy.hp / CONFIG.maxHp, hpColor(enemy.hp), '#f56b6b');
  // 적 오브 게이지 — 가득 차면 곧 필살기가 날아온다는 경고입니다
  const eFull = enemy.gauge >= CONFIG.gaugeMax;
  ctx.textAlign = 'right';
  ctx.font = '9px "Courier New", monospace';
  ctx.fillStyle = eFull ? '#ffd700' : '#6d7a8f';
  ctx.fillText(eFull ? '오브 준비됨!' : '오브', W - 198, HUD_Y + 58);
  ctx.textAlign = 'left';
  bar(W - 194, HUD_Y + 50, 180, 8, enemy.gauge / CONFIG.gaugeMax,
      eFull ? (Math.floor(Date.now() / 250) % 2 ? '#ffd700' : '#fff3b0') : '#7b5cff', '#555');

  // === 음소거 표시 (오른쪽 아래) ===
  ctx.textAlign = 'right';
  ctx.font = '10px "Courier New", monospace';
  ctx.fillStyle = muted ? '#6d7a8f' : '#7ec850';
  ctx.fillText(muted ? '🔇 소리꺼짐 (X)' : '🔊 소리켜짐 (X)', W - 14, HUD_Y + 76);
  ctx.textAlign = 'left';
  // 지금 걸린 아이템 효과
  const buffs = [];
  if (player.buffDouble) buffs.push(['2연발', '#ffd34e']);
  if (player.buffPower)  buffs.push(['강화탄', '#ff7a5c']);
  if (player.buffShield) buffs.push(['방어막', '#5cc8f5']);
  let bx2 = 250;
  for (const [label, col] of buffs) {
    ctx.fillStyle = col + '33';
    ctx.fillRect(bx2, HUD_Y + 54, 54, 16);
    ctx.strokeStyle = col; ctx.lineWidth = 1;
    ctx.strokeRect(bx2 + 0.5, HUD_Y + 54.5, 53, 15);
    ctx.fillStyle = col;
    ctx.font = 'bold 9px "Courier New", monospace';
    ctx.textAlign = 'center';
    ctx.fillText(label, bx2 + 27, HUD_Y + 65);
    ctx.textAlign = 'left';
    bx2 += 58;
  }

  // 현재 난이도 (왼쪽 아래 구석)
  ctx.fillStyle = DIFFICULTY[selDiff].color;
  ctx.font = '9px "Courier New", monospace';
  ctx.fillText(DIFFICULTY[selDiff].name, 202, HUD_Y + 20);
}

function bar(x, y, w, h, ratio, color, border) {
  ctx.fillStyle = 'rgba(0,0,0,0.55)';
  ctx.fillRect(x, y, w, h);
  ctx.fillStyle = color;
  ctx.fillRect(x + 1, y + 1, Math.max(0, (w - 2) * Math.max(0, Math.min(1, ratio))), h - 2);
  ctx.strokeStyle = border;
  ctx.lineWidth = 1;
  ctx.strokeRect(x + 0.5, y + 0.5, w - 1, h - 1);
}

function hpColor(hp) {
  const r = hp / CONFIG.maxHp;
  return r < 0.3 ? '#f44336' : r < 0.6 ? '#ffc107' : '#4caf50';
}

// ---------- 메뉴 화면 ----------
// 왼쪽 열(x 40~510)에 선택 항목, 오른쪽 열(x 530~780)에 조작표를 둡니다
const MENU_L = 30;               // 왼쪽 열 시작 x
// 내 탱크 7종은 4+3 두 줄로 배치합니다
function tankCardRect(i) {
  const col = i % 4, row = Math.floor(i / 4);
  return { x: MENU_L + col * 132, y: 116 + row * 116, w: 124, h: 108 };
}
// 상대 탱크 8칸(7기종 + 무작위)도 4+4 두 줄
function enemyCardRect(i) {
  const col = i % 4, row = Math.floor(i / 4);
  return { x: MENU_L + col * 132, y: 372 + row * 50, w: 124, h: 44 };
}
function diffCardRect(i)  { return { x: MENU_L + i * 176, y: 500, w: 166, h: 46 }; }
function mapCardRect(i)   { return { x: MENU_L + i * 106, y: 588, w: 100, h: 54 }; }
function startBtnRect()   { return { x: MENU_L, y: 660, w: 524, h: 48 }; }

function drawMenu() {
  // 배경
  const bg = ctx.createLinearGradient(0, 0, 0, H);
  bg.addColorStop(0, '#141821');
  bg.addColorStop(1, '#1e2836');
  ctx.fillStyle = bg;
  ctx.fillRect(0, 0, W, H);

  // 제목
  ctx.textAlign = 'center';
  ctx.fillStyle = '#ffd700';
  ctx.font = 'bold 52px "Courier New", monospace';
  ctx.fillText('F O R T R E S S', W / 2, 64);
  ctx.fillStyle = '#6d7a8f';
  ctx.font = '12px "Courier New", monospace';
  ctx.fillText('탱크 · 상대 · 난이도 · 맵을 고르고 출격하세요', W / 2, 90);

  // --- 내 탱크 선택 ---
  ctx.textAlign = 'left';
  ctx.fillStyle = menuRow === 0 ? '#ffd700' : '#8fa3b8';
  ctx.font = 'bold 14px "Courier New", monospace';
  ctx.fillText(menuRow === 0 ? '▶ 1. 내 탱크' : '  1. 내 탱크', MENU_L, 106);

  for (let i = 0; i < TANKS.length; i++) {
    const r = tankCardRect(i);
    const t = TANKS[i];
    const sel = selTank === i;

    ctx.fillStyle = sel ? 'rgba(255,215,0,0.08)' : 'rgba(255,255,255,0.03)';
    ctx.fillRect(r.x, r.y, r.w, r.h);
    ctx.strokeStyle = sel ? '#ffd700' : '#3a4a63';
    ctx.lineWidth = sel ? 3 : 1;
    ctx.strokeRect(r.x, r.y, r.w, r.h);

    // 미니 탱크 그림
    drawMiniTank(i, r.x + r.w / 2, r.y + 36, t.color, 0.82);

    ctx.textAlign = 'center';
    ctx.fillStyle = t.color;
    ctx.font = 'bold 13px "Courier New", monospace';
    ctx.fillText(t.name, r.x + r.w / 2, r.y + 68);
    ctx.fillStyle = '#8fa3b8';
    ctx.font = '8px "Courier New", monospace';
    ctx.fillText(t.desc.split(' — ')[0], r.x + r.w / 2, r.y + 84);
    ctx.fillStyle = '#c9b46a';
    ctx.fillText(`${t.dmg} / ${t.radius}`, r.x + r.w / 2, r.y + 99);
    ctx.textAlign = 'left';
  }

  // --- 상대 탱크 선택 (무작위 포함 4칸) ---
  ctx.fillStyle = menuRow === 1 ? '#ffd700' : '#8fa3b8';
  ctx.font = 'bold 14px "Courier New", monospace';
  ctx.fillText(menuRow === 1 ? '▶ 2. 상대 탱크' : '  2. 상대 탱크', MENU_L, 362);

  for (let i = 0; i < TANKS.length + 1; i++) {
    const r = enemyCardRect(i);
    const sel = selEnemy === i;
    const isRandom = i === TANKS.length;
    const t = isRandom ? null : TANKS[i];

    ctx.fillStyle = sel ? 'rgba(245,107,107,0.10)' : 'rgba(255,255,255,0.03)';
    ctx.fillRect(r.x, r.y, r.w, r.h);
    ctx.strokeStyle = sel ? '#f56b6b' : '#3a4a63';
    ctx.lineWidth = sel ? 3 : 1;
    ctx.strokeRect(r.x, r.y, r.w, r.h);

    ctx.textAlign = 'center';
    if (isRandom) {
      ctx.fillStyle = sel ? '#f56b6b' : '#8fa3b8';
      ctx.font = 'bold 18px "Courier New", monospace';
      ctx.fillText('?', r.x + r.w / 2, r.y + 20);
      ctx.font = 'bold 10px "Courier New", monospace';
      ctx.fillText('무작위', r.x + r.w / 2, r.y + 35);
    } else {
      drawMiniTank(i, r.x + 24, r.y + 22, t.color, 0.44);
      ctx.fillStyle = t.color;
      ctx.font = 'bold 11px "Courier New", monospace';
      ctx.fillText(t.name, r.x + 78, r.y + 20);
      ctx.fillStyle = '#8fa3b8';
      ctx.font = '8px "Courier New", monospace';
      ctx.fillText(`${t.dmg}/${t.radius}`, r.x + 78, r.y + 34);
    }
    ctx.textAlign = 'left';
  }

  // --- 난이도 선택 ---
  ctx.fillStyle = menuRow === 2 ? '#ffd700' : '#8fa3b8';
  ctx.font = 'bold 14px "Courier New", monospace';
  ctx.fillText(menuRow === 2 ? '▶ 3. 난이도' : '  3. 난이도', MENU_L, 490);

  for (let i = 0; i < 3; i++) {
    const r = diffCardRect(i);
    const d = DIFFICULTY[i];
    const sel = selDiff === i;
    ctx.fillStyle = sel ? 'rgba(255,215,0,0.10)' : 'rgba(255,255,255,0.03)';
    ctx.fillRect(r.x, r.y, r.w, r.h);
    ctx.strokeStyle = sel ? d.color : '#3a4a63';
    ctx.lineWidth = sel ? 3 : 1;
    ctx.strokeRect(r.x, r.y, r.w, r.h);
    ctx.textAlign = 'center';
    ctx.fillStyle = sel ? d.color : '#a8b8cc';
    ctx.font = 'bold 14px "Courier New", monospace';
    ctx.fillText(d.name, r.x + r.w / 2, r.y + 22);
    ctx.fillStyle = '#6d7a8f';
    ctx.font = '9px "Courier New", monospace';
    ctx.fillText(d.desc, r.x + r.w / 2, r.y + 40);
    ctx.textAlign = 'left';
  }

  // --- 맵 선택 ---
  ctx.fillStyle = menuRow === 3 ? '#ffd700' : '#8fa3b8';
  ctx.font = 'bold 14px "Courier New", monospace';
  ctx.fillText(menuRow === 3 ? '▶ 4. 맵 선택' : '  4. 맵 선택', MENU_L, 578);

  for (let i = 0; i < MAPS.length; i++) {
    const r = mapCardRect(i);
    const m = MAPS[i];
    const sel = selMap === i;

    // 하늘 미리보기
    const g = ctx.createLinearGradient(0, r.y, 0, r.y + r.h);
    g.addColorStop(0, m.sky[0]);
    g.addColorStop(1, m.sky[1]);
    ctx.fillStyle = g;
    ctx.fillRect(r.x, r.y, r.w, r.h);
    // 지형 미리보기 (아랫부분 물결)
    ctx.fillStyle = m.dirt;
    ctx.beginPath();
    ctx.moveTo(r.x, r.y + r.h);
    for (let px = 0; px <= r.w; px += 4) {
      ctx.lineTo(r.x + px, r.y + r.h - 16 - Math.sin(px * 0.05 + i * 2) * 7);
    }
    ctx.lineTo(r.x + r.w, r.y + r.h);
    ctx.closePath();
    ctx.fill();

    ctx.strokeStyle = sel ? '#ffd700' : '#3a4a63';
    ctx.lineWidth = sel ? 3 : 1;
    ctx.strokeRect(r.x, r.y, r.w, r.h);

    ctx.textAlign = 'center';
    ctx.fillStyle = '#fff';
    ctx.font = 'bold 11px "Courier New", monospace';
    ctx.fillText(m.name, r.x + r.w / 2, r.y + r.h - 6);
    ctx.textAlign = 'left';
  }

  // --- 시작 버튼 ---
  const b = startBtnRect();
  const blink = Math.floor(Date.now() / 400) % 2 === 0;
  ctx.fillStyle = blink ? 'rgba(255,215,0,0.15)' : 'rgba(255,215,0,0.07)';
  ctx.fillRect(b.x, b.y, b.w, b.h);
  ctx.strokeStyle = '#ffd700';
  ctx.lineWidth = 2;
  ctx.strokeRect(b.x, b.y, b.w, b.h);
  ctx.textAlign = 'center';
  ctx.fillStyle = '#ffd700';
  ctx.font = 'bold 22px "Courier New", monospace';
  ctx.fillText('출  격 !  (Enter)', b.x + b.w / 2, b.y + 34);

  ctx.fillStyle = '#556377';
  ctx.font = '10px "Courier New", monospace';
  ctx.fillText('↑↓ 줄 이동 · ←→ 선택 · 마우스 클릭도 됩니다', b.x + b.w / 2, 660);
  ctx.textAlign = 'left';

  drawControlsPanel();
}

// 오른쪽 조작표 — 처음 여는 사람이 조작법을 바로 알 수 있게 게임 화면 안에 둡니다
function drawControlsPanel() {
  const px = 600, py = 106, pw = 300, ph = 540;
  ctx.fillStyle = 'rgba(255,255,255,0.035)';
  ctx.fillRect(px, py, pw, ph);
  ctx.strokeStyle = '#3a4a63';
  ctx.lineWidth = 1;
  ctx.strokeRect(px + 0.5, py + 0.5, pw - 1, ph - 1);

  ctx.textAlign = 'left';
  ctx.fillStyle = '#ffd700';
  ctx.font = 'bold 14px "Courier New", monospace';
  ctx.fillText('조 작 법', px + 18, py + 28);
  ctx.fillStyle = '#3a4a63';
  ctx.fillRect(px + 16, py + 34, pw - 32, 1);

  const rows = [
    ['↑ ↓', '포신 각도'],
    ['← →', '이동 (연료 소모)'],
    ['스페이스 꾹', '파워 충전 → 떼면 발사'],
    ['', ''],
    ['1', '기본샷'],
    ['2', '두 발 (넓게)'],
    ['S', '오브 — 게이지 100 필요'],
    ['', ''],
    ['H', '지난 발사 힌트'],
    ['X', '소리 끄기/켜기'],
    ['R', '같은 조건 재대결'],
    ['M', '이 화면으로'],
  ];
  let y = py + 62;
  for (const [key, desc] of rows) {
    if (!key) { y += 10; continue; }
    ctx.fillStyle = '#e8c14a';
    ctx.font = 'bold 12px "Courier New", monospace';
    ctx.fillText(key, px + 18, y);
    ctx.fillStyle = '#a8b8cc';
    ctx.font = '11px "Courier New", monospace';
    ctx.fillText(desc, px + 120, y);
    y += 25;
  }

  // 핵심 규칙 요약
  ctx.fillStyle = '#3a4a63';
  ctx.fillRect(px + 16, y - 4, pw - 32, 1);
  y += 16;
  ctx.fillStyle = '#7ec850';
  ctx.font = 'bold 11px "Courier New", monospace';
  ctx.fillText('알아두면 좋은 것', px + 18, y);
  y += 18;
  const tips = [
    '· 바람이 포탄을 옆으로 밉니다',
    '· 한 턴 20초, 시간 넘기면 손해',
    '· 적 발밑을 파면 떨어뜨릴 수 있음',
    '· 맞힐수록 오브 게이지가 찹니다',
  ];
  ctx.fillStyle = '#8fa3b8';
  ctx.font = '10px "Courier New", monospace';
  for (const t of tips) { ctx.fillText(t, px + 18, y); y += 17; }
}

// 메뉴 카드용 미니 탱크.
// 실제 게임의 drawTank와 같은 모양을 그려서, 고른 것과 나오는 게 일치하게 합니다.
function drawMiniTank(type, cx, cy, color, scale = 1) {
  // 실제 게임의 drawTank를 그대로 재사용합니다.
  // 예전엔 같은 그림을 두 벌 유지했는데, 기종이 7개로 늘면서 어긋나기 쉬워졌습니다.
  const fake = {
    x: 0, y: 0, hp: CONFIG.maxHp, angle: 32, drawAngle: 32,
    stats: TANKS[type], tilt: 0, recoil: 0, wheelSpin: 0, bob: 0,
    fallFrom: null, gauge: 0, fuel: 0,
  };
  ctx.save();
  ctx.translate(cx, cy + 9 * scale);
  ctx.scale(scale, scale);
  drawTankBody(fake, type, color);
  ctx.restore();
}


// ---------- 게임 종료 화면 ----------
function drawGameOver() {
  ctx.fillStyle = 'rgba(0, 0, 0, 0.7)';
  ctx.fillRect(-20, -20, W + 40, H + 40);

  // 승리 폭죽
  for (const c of confetti) {
    ctx.save();
    ctx.translate(c.x, c.y);
    ctx.rotate(c.spin);
    ctx.fillStyle = c.color;
    ctx.fillRect(-c.size / 2, -c.size / 2, c.size, c.size);
    ctx.restore();
  }

  ctx.textAlign = 'center';
  if (winner === 'player') {
    ctx.fillStyle = '#ffd700';
    ctx.font = 'bold 46px "Courier New", monospace';
    ctx.fillText('승  리 !', W / 2, H / 2 - 30);
  } else if (winner === 'enemy') {
    ctx.fillStyle = '#f56b6b';
    ctx.font = 'bold 46px "Courier New", monospace';
    ctx.fillText('패  배', W / 2, H / 2 - 30);
  } else {
    ctx.fillStyle = '#ccc';
    ctx.font = 'bold 46px "Courier New", monospace';
    ctx.fillText('무 승 부', W / 2, H / 2 - 30);
  }
  ctx.fillStyle = '#fff';
  ctx.font = 'bold 16px "Courier New", monospace';
  ctx.fillText('R 재대결  ·  M 처음 화면', W / 2, H / 2 + 24);
  ctx.textAlign = 'left';
}

// ---------- 루프 ----------
// 게임 속도를 모니터 주사율과 분리합니다.
// 그냥 매 화면마다 update()를 부르면 120Hz 모니터에서는 2배속,
// 60Hz 모니터에서는 절반 속도가 되어버립니다.
// 시간을 재서 "1초에 정확히 120번"만 게임을 진행시킵니다.
const STEP = 1000 / 120;   // 한 걸음 = 1/120초
let lastTime = 0;
let acc = 0;

function loop(ts) {
  if (!lastTime) lastTime = ts;
  let dt = ts - lastTime;
  lastTime = ts;
  if (dt > 100) dt = 100;   // 탭을 오래 벗어났다 돌아와도 몰아서 진행하지 않게 제한

  acc += dt;
  while (acc >= STEP) {
    update();
    acc -= STEP;
  }
  draw();
  requestAnimationFrame(loop);
}

requestAnimationFrame(loop);
</script>
